<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="110" fill="#C9EBDB"/>

  <!-- Baby head -->
  <circle cx="256" cy="264" r="165" fill="#FDF0F5"/>

  <!-- Hair tufts (3 blobs on top) -->
  <ellipse cx="256" cy="108" rx="22" ry="30" fill="#5A9E7E"/>
  <ellipse cx="214" cy="122" rx="18" ry="25" fill="#5A9E7E" transform="rotate(-18,214,122)"/>
  <ellipse cx="298" cy="122" rx="18" ry="25" fill="#5A9E7E" transform="rotate(18,298,122)"/>

  <!-- Happy closed eyes -->
  <path d="M190 248 q30 22 58 0" stroke="#3F8266" stroke-width="13" fill="none" stroke-linecap="round"/>
  <path d="M264 248 q30 22 58 0" stroke="#3F8266" stroke-width="13" fill="none" stroke-linecap="round"/>

  <!-- Blush cheeks -->
  <ellipse cx="174" cy="298" rx="36" ry="24" fill="#F4A8C0" opacity="0.55"/>
  <ellipse cx="338" cy="298" rx="36" ry="24" fill="#F4A8C0" opacity="0.55"/>

  <!-- Smile -->
  <path d="M206 330 q50 42 100 0" stroke="#3F8266" stroke-width="13" fill="none" stroke-linecap="round"/>

  <!-- Big decorative bubble top-right (the "lab" element) -->
  <circle cx="408" cy="108" r="52" fill="#E4DBF5" stroke="#9B8ED4" stroke-width="6"/>
  <!-- Shine on bubble -->
  <circle cx="392" cy="92" r="12" fill="white" opacity="0.55"/>

  <!-- Small bubble bottom-left -->
  <circle cx="100" cy="390" r="32" fill="#FBD9E4" stroke="#D4789B" stroke-width="5"/>
  <circle cx="90" cy="378" r="7" fill="white" opacity="0.5"/>

  <!-- Tiny accent dot -->
  <circle cx="420" cy="400" r="16" fill="#B5E6CE" stroke="#3F8266" stroke-width="4"/>
</svg>
