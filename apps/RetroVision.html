<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroVision | DraftLab</title>
    <link rel="stylesheet" href="../src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="../src/main.js"></script>
</head>

<body
    class="font-mono bg-black text-green-500 overflow-hidden h-[100dvh] w-screen selection:bg-green-900 selection:text-white fixed inset-0">

    <!-- Scanline Effect (Global) -->
    <div
        class="pointer-events-none fixed inset-0 z-50 bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.25)_50%),linear-gradient(90deg,rgba(255,0,0,0.06),rgba(0,255,0,0.02),rgba(0,0,255,0.06))] bg-[length:100%_4px,3px_100%] pointer-events-none">
    </div>
    <div
        class="pointer-events-none fixed inset-0 z-50 bg-[radial-gradient(circle_at_center,transparent_50%,rgba(0,0,0,0.4)_100%)]">
    </div>

    <dl-header></dl-header>

    <main class="relative w-full h-full flex items-center justify-center">

        <!-- App Title / Logo Overlay -->
        <div
            class="fixed top-16 left-4 z-40 bg-black/60 backdrop-blur-sm border border-green-900/30 px-4 py-2 rounded-lg pointer-events-none select-none">
            <h1 class="text-sm md:text-base font-bold text-green-500 tracking-widest flex items-center gap-2">
                <i data-lucide="scan-line" class="w-4 h-4"></i>
                RETROVISION
            </h1>
            <div class="text-[10px] text-green-800 tracking-[0.2em] font-light">OPTICAL SENSOR FEED</div>
        </div>

        <!-- Video Source (Hidden) -->
        <video id="video-source" class="hidden" playsinline autoplay muted></video>

        <!-- ASCII Canvas -->
        <canvas id="ascii-canvas" class="w-full h-full object-cover"></canvas>

        <!-- UI Controls Overlay -->
        <!-- Fixed positioning with bottom safe area support -->
        <!-- Settings Panel (Collapsible) -->
        <div id="ui-panel"
            class="fixed bottom-28 left-1/2 -translate-x-1/2 z-[60] bg-black/90 backdrop-blur-md border border-green-900/50 p-4 rounded-lg flex flex-col items-center gap-4 shadow-[0_0_30px_rgba(0,255,0,0.1)] transition-all duration-300 max-w-[95vw] w-auto origin-bottom transform translate-y-[150%] opacity-0 pointer-events-none data-[visible=true]:translate-y-0 data-[visible=true]:opacity-100 data-[visible=true]:pointer-events-auto">

            <div class="flex flex-wrap md:flex-nowrap items-center justify-center gap-6">
                <!-- Charset Selector -->
                <div class="flex flex-col gap-1 items-center">
                    <label class="text-[10px] uppercase tracking-wider text-green-700"
                        data-i18n="rv.lbl.charset">Charset</label>
                    <div class="flex bg-green-900/20 rounded p-1 border border-green-900/30">
                        <button
                            class="px-3 py-1 text-[10px] md:text-xs hover:bg-green-500/20 rounded transition-colors active-mode text-green-400"
                            data-charset="matrix">KATAKANA</button>
                        <button
                            class="px-3 py-1 text-[10px] md:text-xs hover:bg-green-500/20 rounded transition-colors text-gray-400"
                            data-charset="binary">BINARY</button>
                        <button
                            class="px-3 py-1 text-[10px] md:text-xs hover:bg-green-500/20 rounded transition-colors text-gray-400"
                            data-charset="ascii">ASCII</button>
                    </div>
                </div>

                <!-- Density Slider -->
                <div class="flex flex-col gap-1 w-32">
                    <label class="text-[10px] uppercase tracking-wider text-green-700 flex justify-between">
                        <span data-i18n="rv.lbl.density">Density</span>
                        <span id="density-val">12px</span>
                    </label>
                    <input type="range" id="density-slider" min="6" max="24" step="2" value="12"
                        class="accent-green-500 h-1 bg-green-900/50 rounded appearance-none cursor-pointer">
                </div>

                <!-- Color Mode -->
                <div class="flex flex-col gap-1 items-center">
                    <label class="text-[10px] uppercase tracking-wider text-green-700"
                        data-i18n="rv.lbl.color">Color</label>
                    <div class="flex gap-2">
                        <button
                            class="w-6 h-6 rounded-full bg-green-500 border border-transparent hover:scale-110 transition-transform active-color ring-2 ring-green-900"
                            data-color="green" title="Phosphor Green"></button>
                        <button
                            class="w-6 h-6 rounded-full bg-amber-500 border border-transparent hover:scale-110 transition-transform"
                            data-color="amber" title="Amber Terminal"></button>
                        <button
                            class="w-6 h-6 rounded-full bg-white border border-transparent hover:scale-110 transition-transform"
                            data-color="white" title="White/B&W"></button>
                    </div>
                </div>
            </div>

            <!-- Close handle -->
            <button id="btn-close-ui"
                class="md:hidden w-full flex justify-center text-green-900 hover:text-green-500 pt-2 border-t border-green-900/30">
                <i data-lucide="chevron-down" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Persistent Bottom Bar -->
        <!-- Added gradient background for better visibility -->
        <div
            class="fixed bottom-0 left-0 w-full z-[70] pb-8 pt-12 bg-gradient-to-t from-black via-black/80 to-transparent flex items-end justify-center pointer-events-none">

            <div class="flex items-center gap-8 pointer-events-auto relative">
                <!-- Settings Toggle -->
                <button id="btn-open-ui"
                    class="w-12 h-12 bg-black/60 backdrop-blur-sm border border-green-900/50 text-green-500 rounded-full flex items-center justify-center hover:bg-green-500 hover:text-black transition-all hover:scale-105 active:scale-95">
                    <i data-lucide="sliders-horizontal" class="w-5 h-5"></i>
                </button>

                <!-- SNAP Button (Primary) -->
                <button id="btn-snapshot"
                    class="w-20 h-20 bg-green-500/10 backdrop-blur-sm border-2 border-green-500 text-green-500 rounded-full flex items-center justify-center hover:bg-green-500 hover:text-black transition-all shadow-[0_0_20px_rgba(0,255,0,0.2)] active:scale-90 group relative z-10">
                    <i data-lucide="camera" class="w-8 h-8 group-hover:scale-110 transition-transform"></i>
                </button>

                <!-- Placeholder for symmetry -->
                <div class="w-12 h-12 flex items-center justify-center">
                    <span class="text-[10px] text-green-900 font-bold tracking-tighter opacity-50">REC</span>
                </div>
            </div>

        </div>

        <!-- Permission Prompt (Overlay) -->
        <div id="permission-overlay"
            class="fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center p-4 text-center">
            <i data-lucide="video" class="w-12 h-12 text-green-500 mb-4 animate-pulse"></i>
            <h2 class="text-xl font-bold mb-2" data-i18n="rv.overlay.title">ACCESS_TERMINAL_CAMERA</h2>
            <p class="text-gray-400 text-sm max-w-md mb-6" data-i18n="rv.overlay.desc">RetroVision requires optical
                sensor access to generate the matrix feed. Using locally.</p>
            <button id="btn-start"
                class="bg-green-500/10 border border-green-500 text-green-500 px-8 py-3 rounded hover:bg-green-500 hover:text-black transition-all uppercase tracking-widest text-sm"
                data-i18n="rv.overlay.btn">
                Initialize System
            </button>
        </div>

    </main>

    <script type="module">
        import { init as initNucleus } from '../src/core/Nucleus.js';
        initNucleus();
        lucide.createIcons();
    </script>
    <script type="module" src="../src/apps/retrovision/logic.js"></script>
</body>

</html>
