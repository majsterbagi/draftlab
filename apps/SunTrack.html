<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- iOS PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SunTrack">
    <meta name="theme-color" content="#0f2027" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f2027" media="(prefers-color-scheme: dark)">

    <title>SunTrack | DraftLab.pl</title>

    <!-- Import JetBrains Mono for consistency -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.8.0/suncalc.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../src/style.css">

    <style>
        :root {
            --bg-top: #0f2027;
            --bg-mid: #203a43;
            --bg-bottom: #2c5364;
            --glass-bg: rgba(20, 20, 25, 0.85);
            --text-primary: #ffffff;
            --sun-x: 50%;
            --sun-y: 60%;
        }

        html {
            background-color: #0f2027;
            /* To jest klucz dla Safari */
            height: 100%;
        }

        body {
            margin: 0;
            /* Fix dla mobilnych pasków adresu: używamy dvh (dynamic viewport height) */
            height: 100vh;
            /* Fallback */
            height: 100dvh;
            padding-top: env(safe-area-inset-top);
            /* Padding bottom przeniesiony do ui-panel, żeby tło dochodziło do krawędzi */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, var(--bg-top), var(--bg-mid), var(--bg-bottom));
            background-size: 100% 100%;
            background-repeat: no-repeat;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: var(--text-primary);
            overscroll-behavior: none;
        }



        /* --- SKY CONTAINER --- */
        .sky-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        /* GWIAZDY */
        .stars-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease;
            z-index: 1;
        }

        .stars {
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0, 0, 0, 0)),
                radial-gradient(1.5px 1.5px at 150px 70px, #fff, rgba(0, 0, 0, 0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0, 0, 0, 0)),
                radial-gradient(1.5px 1.5px at 200px 40px, #fff, rgba(0, 0, 0, 0)),
                radial-gradient(2px 2px at 300px 120px, #fff, rgba(0, 0, 0, 0));
            background-repeat: repeat;
            background-size: 350px 350px;
            background-size: 350px 350px;
            animation: twinkle 4s infinite ease-in-out;
        }

        /* --- WORLD LAYERS (GRAIN & LANDSCAPE) --- */
        /* Grain Removed */

        .landscape-layer {
            position: absolute;
            bottom: 50%;
            left: 0;
            width: 100%;
            height: 40%;
            z-index: 6;
            pointer-events: none;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        /* --- DETALE ARCHITEKTURY --- */
        /* Okna */
        .window {
            fill: #1a1a1a;
            /* Ciemne w dzień (zgaszone) */
            transition: fill 3s ease, filter 3s ease;
        }

        /* Tryb nocny (klasa dodawana przez JS) */
        .landscape-layer.lights-on .window {
            fill: #FCD067;
            /* Ciepłe światło */
            filter: drop-shadow(0 0 5px rgba(252, 208, 103, 0.6));
        }

        /* Losowe migotanie świateł w mieście dla żywszego efektu */
        .landscape-layer.lights-on .window:nth-child(3n) {
            animation: flicker 7s infinite alternate;
        }

        .landscape-layer.lights-on .window:nth-child(7n) {
            animation: flicker 5s infinite alternate-reverse;
        }

        @keyframes flicker {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        /* Dym z komina */
        .smoke-particle {
            fill: rgba(255, 255, 255, 0.6);
            animation: smoke-rise 6s infinite ease-out;
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
        }

        .s1 {
            animation-delay: 0s;
            transform: scale(0.8);
        }

        .s2 {
            animation-delay: 2s;
            transform: scale(1);
        }

        .s3 {
            animation-delay: 4s;
            transform: scale(1.2);
        }

        @keyframes smoke-rise {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0.6;
            }

            50% {
                opacity: 0.4;
            }

            100% {
                transform: translateY(-40px) scale(2.5) translateX(10px);
                opacity: 0;
            }
        }

        /* --- DETALE ARCHITEKTURY --- */
        /* Okna */
        .window {
            fill: #1a1a1a;
            /* Ciemne w dzień (zgaszone) */
            transition: fill 3s ease, filter 3s ease;
        }

        /* Tryb nocny (klasa dodawana przez JS) */
        .landscape-layer.lights-on .window {
            fill: #FCD067;
            /* Ciepłe światło */
            filter: drop-shadow(0 0 5px rgba(252, 208, 103, 0.6));
        }

        /* Losowe migotanie świateł w mieście dla żywszego efektu */
        .landscape-layer.lights-on .window:nth-child(3n) {
            animation: flicker 7s infinite alternate;
        }

        .landscape-layer.lights-on .window:nth-child(7n) {
            animation: flicker 5s infinite alternate-reverse;
        }

        @keyframes flicker {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        /* Dym z komina */
        .smoke-particle {
            fill: rgba(255, 255, 255, 0.6);
            animation: smoke-rise 6s infinite ease-out;
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
        }

        .s1 {
            animation-delay: 0s;
            transform: scale(0.8);
        }

        .s2 {
            animation-delay: 2s;
            transform: scale(1);
        }

        .s3 {
            animation-delay: 4s;
            transform: scale(1.2);
        }

        @keyframes smoke-rise {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0.6;
            }

            50% {
                opacity: 0.4;
            }

            100% {
                transform: translateY(-40px) scale(2.5) translateX(10px);
                opacity: 0;
            }
        }

        /* Warianty krajobrazu */
        .world-variant {
            width: 100%;
            height: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            opacity: 0;
            transition: opacity 1s ease;
            fill: #000510;
            /* Kolor sylwetki */
        }

        .world-variant.active {
            opacity: 1;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.9;
            }

            50% {
                opacity: 0.6;
            }
        }

        /* WARSTWA DZIENNA */
        .day-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 2s ease;
            z-index: 2;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            /* Fizyczna biel */
            border-radius: 100px;
            /* Baza chmury (pill shape) */
            filter: blur(12px);
            /* Zmiękczenie krawędzi */
            opacity: 0.9;
        }

        /* "Góry" chmury dla naturalnego kształtu */
        .cloud::after,
        .cloud::before {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }

        .cloud::after {
            width: 50%;
            height: 100%;
            top: -50%;
            left: 10%;
        }

        .cloud::before {
            width: 60%;
            height: 140%;
            top: -70%;
            right: 15%;
        }

        .c1 {
            width: 160px;
            height: 60px;
            top: 15%;
            left: -20%;
            animation: float 45s linear infinite;
        }

        .c3 {
            width: 120px;
            height: 40px;
            top: 25%;
            left: -20%;
            animation: float 60s linear infinite 15s;
            /* Wolniej i rzadziej */
        }

        @keyframes float {
            0% {
                transform: translateX(-150px);
            }

            100% {
                transform: translateX(120vw);
            }
        }

        .bird-container {
            position: absolute;
            top: 20%;
            left: -10%;
            animation: fly-across 20s linear infinite 2s;
            opacity: 0.8;
            z-index: 3;
        }

        .bird {
            width: 12px;
            height: 8px;
            fill: none;
            stroke: rgba(0, 0, 0, 0.75);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            animation: wing-flap 0.5s infinite alternate;
        }

        .b-small {
            width: 8px;
            height: 6px;
            position: absolute;
            top: 10px;
            left: -15px;
            animation-delay: 0.1s;
        }

        .b-tiny {
            width: 6px;
            height: 4px;
            position: absolute;
            top: -5px;
            left: -25px;
            animation-delay: 0.2s;
        }

        @keyframes fly-across {
            0% {
                transform: translateX(-50px) translateY(0) scale(0.8);
            }

            25% {
                transform: translateX(30vw) translateY(10px) scale(0.9);
            }

            50% {
                transform: translateX(60vw) translateY(-5px) scale(1);
            }

            100% {
                transform: translateX(120vw) translateY(15px) scale(0.8);
            }
        }

        @keyframes wing-flap {
            0% {
                d: path("M0 4 Q6 8 12 4");
                transform: translateY(0);
            }

            100% {
                d: path("M0 4 Q6 0 12 4");
                transform: translateY(2px);
            }
        }

        /* SŁOŃCE */
        .sun-orb {
            position: absolute;
            left: var(--sun-x);
            bottom: var(--sun-y);
            width: 42px;
            height: 42px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, 50%);
            box-shadow: 0 0 30px 10px rgba(255, 215, 0, 0.4);
            z-index: 5;
            transition: box-shadow 0.3s ease, background 0.3s ease;
        }

        .sun-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350%;
            height: 350%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0) 65%);
            opacity: 0.5;
            border-radius: 50%;
            pointer-events: none;
        }

        /* --- UI PANEL --- */
        .ui-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            max-height: 60dvh;
            /* Ograniczenie wysokości na bardzo wysokich ekranach */
            background: var(--glass-bg);
            backdrop-filter: blur(35px) saturate(110%);
            -webkit-backdrop-filter: blur(35px) saturate(110%);
            border-radius: 36px 36px 0 0;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 -1px 20px rgba(255, 255, 255, 0.1), 0 -10px 50px rgba(0, 0, 0, 0.3);
            z-index: 10;
            display: flex;
            flex-direction: column;
            /* KLUCZOWA ZMIANA: Padding uwzględniający Safe Area */
            padding: 20px 24px calc(20px + env(safe-area-inset-bottom)) 24px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .location-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            /* DODAJ TO: */
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .location-badge:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #00ff9d;
            color: #fff;
        }

        .date-text {
            /* Data przeniesiona inline */
            display: none;
        }

        .main-time {
            font-size: 42px;
            /* Domyślnie mniejszy */
            font-weight: 200;
            margin: 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #fff 20%, rgba(255, 255, 255, 0.7) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.1));
        }

        /* Adjust font size for smaller screens */
        @media (max-height: 700px) {
            .main-time {
                font-size: 38px;
                /* Jeszcze mniejszy zegar */
                margin: 0;
            }

            .ui-panel {
                height: auto;
                /* Auto height to fit content */
                max-height: 60dvh;
            }

            .header {
                margin-bottom: 5px;
            }
        }

        .ground-filler {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: #000510;
            z-index: 5;
            /* Behind UI (10) and Landscape (6) */
        }

        .content-area {
            position: relative;
            flex-grow: 1;
            overflow-y: auto;
            /* Zabezpieczenie przed przepełnieniem */
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            /* Płynne przewijanie na iOS */
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            /* Najmniejszy możliwy odstęp */
            margin-top: 2px;
            padding-bottom: 2px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.04);
            padding: 6px;
            /* Ekstremalnie mały padding */
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .info-value {
            font-size: 15px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: #fff;
            line-height: 1.1;
        }

        /* SLIDER & CONTROLS */
        .slider-wrapper {
            margin-top: auto;
            padding-top: 20px;
            /* Padding bottom jest teraz obsłużony przez kontener .ui-panel z env() */
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 20;
            flex-shrink: 0;
            /* Zapobiega zgniataniu slidera */
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .slider-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 700;
        }

        /* BUTTONS */
        .reset-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            font-size: 10px;
            padding: 8px 16px;
            border-radius: 14px;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        /* --- SUWAK --- */
        input[type=range] {
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            margin: 0;
            position: relative;
            z-index: 2;
            cursor: pointer;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            height: 32px;
            width: 32px;
            border-radius: 50%;
            background: #ffffff;
            cursor: grab;
            margin-top: -14px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        input[type=range]:active::-webkit-slider-thumb {
            transform: scale(1.1);
            background: #f0f0f0;
        }
    </style>
</head>

                    <path d="M0,40 L15,10 L30,40" fill="#000510" />
                    <rect x="10" y="55" width="10" height="20" class="window" rx="5" /> <!-- Okno wieży -->
                    <circle cx="60" cy="50" r="8" class="window" /> <!-- Rozeta -->
                </g>

                <!-- Domek 2 -->
                <g transform="translate(1100, 220)">
                    <rect x="0" y="20" width="100" height="60" fill="#000510" />
                    <path d="M0,20 L50,-10 L100,20" fill="#000510" />
                    <rect x="15" y="35" width="25" height="25" class="window" />
                    <rect x="60" y="35" width="25" height="25" class="window" />
                </g>
            </svg>

            <!-- 3. CITY / METROPOLIS (Procedural Distant View) -->
            <svg class="world-variant" id="world-city" viewBox="0 0 1440 320" preserveAspectRatio="xMidYMax slice">
                <defs>
                    <rect id="w-small" width="3" height="3" class="window" />
                </defs>
                <!-- Tło (ziemia) -->
                <rect x="0" y="280" width="1440" height="40" fill="#000510" />

                <!-- Warstwy proceduralne -->
                <g id="city-back"></g> <!-- Daleki plan (sylwetki) -->
                <g id="city-mid"></g> <!-- Średni plan -->
                <g id="city-front"></g> <!-- Bliski plan (detale) -->
            </svg>
        </div>
    </div>

    <div class="ground-filler"></div>

    <!-- UI -->
    <div class="ui-panel">
        <div class="header">
            <div style="display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 2px;">
                <div class="location-badge" id="location-badge">
                    <i data-lucide="map-pin" width="10"></i> <span id="location-name">Warszawa</span>
                </div>
                <!-- Data przeniesiona obok lokalizacji -->
                <div class="date-text" id="date-text" style="font-size: 11px; opacity: 0.6; text-transform: uppercase;">
                    --</div>
            </div>

            <div class="main-time" id="main-time">12:00</div>
        </div>

        <!-- CONTENT AREA -->
        <div class="content-area">
            <div id="info-grid" class="info-grid">
                <div class="info-card">
                    <span class="info-label"><i data-lucide="sunrise" width="10"></i> Wschód</span>
                    <span class="info-value" id="sunrise-val">--:--</span>
                </div>
                <div class="info-card">
                    <span class="info-label"><i data-lucide="sunset" width="10"></i> Zachód</span>
                    <span class="info-value" id="sunset-val">--:--</span>
                </div>
                <div class="info-card">
                    <span class="info-label"><i data-lucide="moon" width="10"></i> Faza</span>
                    <span class="info-value" style="font-size: 14px;" id="phase-val">--</span>
                </div>

                <div class="info-card">
                    <span class="info-label"><i data-lucide="sparkles" width="9"></i> Złota Rano</span>
                    <span class="info-value" id="golden-am-val">--:--</span>
                </div>
                <div class="info-card">
                    <span class="info-label"><i data-lucide="sparkles" width="9"></i> Złota Wiecz.</span>
                    <span class="info-value" id="golden-pm-val">--:--</span>
                </div>
                <div class="info-card">
                    <span class="info-label"><i data-lucide="move-up" width="10"></i> Alt</span>
                    <span class="info-value" id="elevation-val">0°</span>
                </div>
            </div>
        </div>

        <div class="slider-wrapper">
            <div class="slider-header">
                <span class="slider-label">Podróż w czasie</span>
                <button class="reset-btn" onclick="resetToNow()">TERAZ</button>
            </div>
            <input type="range" id="time-slider" min="0" max="1439" value="720">
        </div>
    </div>

    <script>
        lucide.createIcons();

        // 1. KONFIGURACJA I ZMIENNE
        let LAT = 52.2297; // Default: Warszawa (zmieni się po GPS)
        let LNG = 21.0122;

        let isLive = true; // Startujemy w trybie czasu rzeczywistego
        let clockInterval = null;

        // Cache elementów DOM
        const sunOrb = document.getElementById('sun-orb');
        const starsWrapper = document.getElementById('stars-wrapper');
        const dayLayer = document.getElementById('day-layer');
        const root = document.documentElement;
        const locationNameEl = document.getElementById('location-name');
        const slider = document.getElementById('time-slider');

        // Data w nagłówku
        const now = new Date();
        const dateOptions = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById('date-text').innerText = now.toLocaleDateString('pl-PL', dateOptions);

        // 2. LOGIKA KOLORÓW (VIVID DREAMS - World Only)
        // Bardziej nasycona paleta dla tła
        const COLOR_KEYS = [
            { alt: -90, stops: ['#040810', '#0a0f1c', '#151b2b'] }, // Deep Neutral Night (mniej fioletu)
            { alt: -12, stops: ['#0f172a', '#2e3b55', '#605868'] }, // Blue Hour (naturalny granat/szarość)
            { alt: -6, stops: ['#2c1a3d', '#8a4c60', '#ffcda5'] }, // Civil Twilight (mniej neonowego różu)
            { alt: -2, stops: ['#4b2c35', '#d96c6c', '#ffd6a5'] }, // Sunrise (ciepły pomarańcz)
            { alt: 5, stops: ['#3a6ea5', '#88c0d0', '#e0f7fa'] }, // Morning (czysty błękit)
            { alt: 25, stops: ['#285e92', '#69b3e7', '#f0fbff'] }  // Day (naturalne niebo)
        ];

        function lerpColor(c1, c2, f) {
            const hex2rgb = (hex) => {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return [r, g, b];
            }
            const rgb1 = hex2rgb(c1);
            const rgb2 = hex2rgb(c2);
            const r = Math.round(rgb1[0] + (rgb2[0] - rgb1[0]) * f);
            const g = Math.round(rgb1[1] + (rgb2[1] - rgb1[1]) * f);
            const b = Math.round(rgb1[2] + (rgb2[2] - rgb1[2]) * f);
            return `rgb(${r},${g},${b})`;
        }

        function getGradient(alt) {
            let start = COLOR_KEYS[0], end = COLOR_KEYS[COLOR_KEYS.length - 1];
            for (let i = 0; i < COLOR_KEYS.length - 1; i++) {
                if (alt >= COLOR_KEYS[i].alt && alt <= COLOR_KEYS[i + 1].alt) {
                    start = COLOR_KEYS[i]; end = COLOR_KEYS[i + 1]; break;
                }
            }
            const factor = Math.min(1, Math.max(0, (alt - start.alt) / (end.alt - start.alt)));
            return {
                top: lerpColor(start.stops[0], end.stops[0], factor),
                mid: lerpColor(start.stops[1], end.stops[1], factor),
                bottom: lerpColor(start.stops[2], end.stops[2], factor)
            };
        }

        // 3. SILNIK RENDERUJĄCY
        function update(mins) {
            const h = Math.floor(mins / 60);
            const m = Math.floor(mins % 60);

            // Zegar cyfrowy
            const currentTimeStr = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
            document.getElementById('main-time').innerText = currentTimeStr;

            // Obliczenia astronomiczne
            const d = new Date();
            d.setHours(h, m, 0);

            const times = SunCalc.getTimes(d, LAT, LNG);
            const pos = SunCalc.getPosition(d, LAT, LNG);

            const fmt = date => (date && !isNaN(date)) ? date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0') : '--:--';

            // Helper for ranges
            const fmtRange = (start, end) => {
                if (!start || !end || isNaN(start) || isNaN(end)) return '--:--';
                return `${fmt(start)} - ${fmt(end)}`;
            };

            document.getElementById('sunrise-val').innerText = fmt(times.sunrise);
            document.getElementById('sunset-val').innerText = fmt(times.sunset);

            // Modified Golden Hour logic (Ranges)
            document.getElementById('golden-am-val').innerText = fmtRange(times.sunrise, times.goldenHourEnd);
            document.getElementById('golden-pm-val').innerText = fmtRange(times.goldenHour, times.sunset);

            const altDeg = pos.altitude * (180 / Math.PI);
            document.getElementById('elevation-val').innerText = Math.round(altDeg) + '°';

            // Faza dnia
            let phase = "Noc";
            if (altDeg > 6) phase = "Dzień";
            else if (altDeg > -4) phase = "Złota Godzina";
            else if (altDeg > -12) phase = "Blue Hour";
            document.getElementById('phase-val').innerText = phase;

            // Update Tła
            const grad = getGradient(altDeg);
            root.style.setProperty('--bg-top', grad.top);
            root.style.setProperty('--bg-mid', grad.mid);
            root.style.setProperty('--bg-bottom', grad.bottom);



            // Gwiazdy vs Dzień
            let starsOp = 0; let dayOp = 0;
            if (altDeg < -12) { starsOp = 1; dayOp = 0; }
            else if (altDeg < -6) { starsOp = ((-6 - altDeg) / 6); dayOp = 0; }
            else if (altDeg < 0) { starsOp = 0; dayOp = (altDeg - (-6)) / 6; }
            else { starsOp = 0; dayOp = 1; }

            starsWrapper.style.opacity = starsOp;
            dayLayer.style.opacity = dayOp;

            // --- FIZYKA SŁOŃCA (POPRAWKA MOBILE + ZIMOWA) ---
            const xPercent = (mins / 1440) * 100;

            // Detekcja mobile (< 768px)
            const isMobile = window.innerWidth < 768;

            // Podnosimy horyzont. Dla zimy (niski altDeg) dodajemy extra boost.
            let horizonY = 52; // GROUND LEVEL (tuż nad UI 50%)

            // Boost dla niskich trajektorii
            // Rozwiązanie: "Visual Sun Magnification"
            // Mnożymy kąt x2.5, żeby słońce szybciej uciekało w górę (czyli omijało budynki),
            // ale ZAWSZE startowało z poziomu horizonY (bo 0 * 2.5 = 0).

            const skyRange = 45;

            // Wizualna korekta: Spłaszczamy dół paraboli, żeby słońce nie spadało za nisko
            let visualAlt = altDeg * 2.5;
            if (visualAlt > 90) visualAlt = 90; // Cap at zenith height

            let yPercent = horizonY + (visualAlt / 90) * skyRange;
            // Czekaj, w CSS jest bottom: var(--sun-y). 
            // Wcześniej: horizonY + (alt/90)*sky. 
            // Jeśli alt=0 -> horizonY (75%). Jeśli alt=90 -> 75+40=115%.

            root.style.setProperty('--sun-x', xPercent + '%');
            root.style.setProperty('--sun-y', yPercent + '%');

            // Styl słońca (Natural)
            if (altDeg < 4 && altDeg > -4) {
                // Sunset / Sunrise: Ciepły pomarańcz/czerwień
                sunOrb.style.background = '#ffba5a';
                sunOrb.style.boxShadow = '0 0 60px 20px rgba(255, 120, 50, 0.8)';
            } else if (altDeg >= 4) {
                // Dzień: Złamana biel (lekko żółtawa)
                sunOrb.style.background = '#fffae5';
                sunOrb.style.boxShadow = '0 0 50px 15px rgba(255, 245, 200, 0.5)';
            } else {
                sunOrb.style.background = 'transparent';
                sunOrb.style.boxShadow = 'none';
            }

            // --- ŚWIATŁA NOCNE ---
            const landscapeEl = document.getElementById('landscape-layer');
            if (altDeg < -4) {
                // Zapalamy światła w Blue Hour i Nocy
                landscapeEl.classList.add('lights-on');
            } else {
                landscapeEl.classList.remove('lights-on');
            }
        } // <--- KONIEC FUNKCJI UPDATE

        // --- PROCEDURALNA METROPOLIA ---
        function generateMetropolis() {
            const createBuilding = (x, w, h, layerId, color, hasWindows) => {
                const ns = "http://www.w3.org/2000/svg";
                const g = document.createElementNS(ns, "g");
                // Base 320, we draw up from 300 to keep footer clear usually, but let's base on 320 for perspective
                // Let's assume ground is around 300
                const baseY = 300;
                g.setAttribute("transform", `translate(${x}, ${baseY - h})`);

                const rect = document.createElementNS(ns, "rect");
                rect.setAttribute("width", w);
                rect.setAttribute("height", h);
                rect.setAttribute("fill", color);
                g.appendChild(rect);

                if (hasWindows) {
                    const winG = document.createElementNS(ns, "g");
                    // Random grid pattern
                    const cols = Math.floor(w / 6);
                    const rows = Math.floor(h / 6);

                    // Not every window exists
                    for (let r = 1; r < rows - 1; r++) {
                        for (let c = 1; c < cols - 1; c++) {
                            if (Math.random() > 0.4) {
                                const use = document.createElementNS(ns, "use");
                                use.setAttribute("href", "#w-small");
                                use.setAttribute("x", c * 5);
                                use.setAttribute("y", r * 5);
                                winG.appendChild(use);
                            }
                        }
                    }
                    g.appendChild(winG);
                }
                document.getElementById(layerId).appendChild(g);
            };

            // 1. BACK (Ciemne, małe, gęste)
            let x = -50;
            while (x < 1500) {
                const w = 10 + Math.random() * 20;
                const h = 20 + Math.random() * 40;
                createBuilding(x, w, h, 'city-back', '#030508', false);
                x += w - 2; // slight overlap
            }

            // 2. MID (Średnie, trochę okien)
            x = -20;
            while (x < 1500) {
                if (Math.random() > 0.3) {
                    const w = 20 + Math.random() * 30;
                    const h = 40 + Math.random() * 50;
                    createBuilding(x, w, h, 'city-mid', '#050a10', Math.random() > 0.5);
                    x += w + Math.random() * 5;
                } else {
                    x += 10;
                }
            }

            // 3. FRONT (Wyższe, detale, ale bez przesady)
            x = 0;
            while (x < 1500) {
                if (Math.random() > 0.6) { // rzadziej
                    const w = 30 + Math.random() * 40;
                    const h = 60 + Math.random() * 60; // Max 120 height from 300 = top at 180. Still safe for sun.
                    createBuilding(x, w, h, 'city-front', '#080d14', true);
                    x += w + Math.random() * 40;
                } else {
                    x += 20;
                }
            }
        }


        // 4. LOGIKA CZASU RZECZYWISTEGO
        function startClock() {
            if (clockInterval) clearInterval(clockInterval);
            clockInterval = setInterval(() => {
                if (isLive) {
                    const d = new Date();
                    const totalMins = d.getHours() * 60 + d.getMinutes() + (d.getSeconds() / 60);
                    slider.value = totalMins;
                    update(totalMins);
                }
            }, 1000);
        }

        // Funkcja resetująca do "TERAZ"
        function resetToNow() {
            isLive = true;
            const d = new Date();
            const mins = d.getHours() * 60 + d.getMinutes();
            slider.value = mins;
            update(mins);
        }
        window.resetToNow = resetToNow;

        // Obsługa suwaka (Zabija tryb Live)
        slider.addEventListener('input', (e) => {
            isLive = false;
            update(parseFloat(e.target.value));
        });

        // Obsługa zmiany rozmiaru okna
        window.addEventListener('resize', () => {
            if (!isLive) update(parseFloat(slider.value));
            else resetToNow();
        });

        // 5. GEOLOKALIZACJA HYBRYDOWA (GPS + IP FALLBACK)

        // Listener kliknięcia
        const badgeBtn = document.getElementById('location-badge');
        const newBadgeBtn = badgeBtn.cloneNode(true);
        badgeBtn.parentNode.replaceChild(newBadgeBtn, badgeBtn);

        newBadgeBtn.addEventListener('click', () => {
            initLocation();
        });

        // Funkcja pomocnicza: Lokalizacja po IP (nie wymaga zgody)
        async function locateByIP() {
            locationNameEl.innerHTML = '<span class="animate-pulse text-yellow-500">Namierzanie IP...</span>';
            console.log("Próba lokalizacji po IP...");

            try {
                // Używamy darmowego API do geolokalizacji IP
                const response = await fetch('https://ipapi.co/json/');
                if (!response.ok) throw new Error("IP API Fail");

                const data = await response.json();

                LAT = data.latitude;
                LNG = data.longitude;
                const city = data.city || data.region || "Lokalizacja IP";

                // Detekcja typu świata po IP (fallback to city usually)
                updateWorldType('city', city); // IP API rzadko zwraca wsie, zakładamy miasto

                // Aktualizujemy słońce
                if (isLive) resetToNow();

                // Wyświetlamy wynik
                locationNameEl.innerText = city.toUpperCase();
                console.log("Sukces IP:", city);

            } catch (err) {
                console.error(err);
                locationNameEl.innerText = "WARSZAWA (OFFLINE)";
            }
        }

        function initLocation() {
            locationNameEl.innerHTML = '<span class="animate-pulse text-tech-green" style="color:#00ff9d">Szukam GPS...</span>';

            const restoreBadge = () => { setTimeout(() => { locationNameEl.style.color = ''; }, 2000); };

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        // --- SUKCES GPS ---
                        LAT = position.coords.latitude;
                        LNG = position.coords.longitude;
                        if (isLive) resetToNow();

                        // Reverse Geocoding dla ładnej nazwy
                        try {
                            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${LAT}&lon=${LNG}`);
                            const data = await response.json();
                            const addr = data.address;
                            const placeName = addr.city || addr.town || addr.village || addr.suburb || "GPS PRECYZYJNY";
                            locationNameEl.innerText = placeName.toUpperCase();

                            // Logika wyboru tła
                            const type = addr.city ? 'city' : (addr.town || addr.suburb ? 'town' : 'village');
                            updateWorldType(type, placeName);
                            console.log("Wykryto krajobraz:", type);
                        } catch (e) {
                            locationNameEl.innerText = `${LAT.toFixed(2)}, ${LNG.toFixed(2)}`;
                        }
                    },
                    (error) => {
                        // --- BŁĄD GPS -> PRZEŁĄCZAMY NA IP ---
                        console.warn("GPS zablokowany (" + error.code + "). Przełączam na IP.");
                        locateByIP(); // <--- TUTAJ JEST MAGIA
                    },
                    { enableHighAccuracy: false, timeout: 5000, maximumAge: 0 }
                );
            } else {
                // Brak API -> Przełącz na IP
                locateByIP();
            }
        }

        // --- WORLD MANAGER ---
        function updateWorldType(type, debugName) {
            // Ukryj wszystkie
            document.querySelectorAll('.world-variant').forEach(el => el.classList.remove('active'));

            // Pokaż odpowiedni
            if (type === 'city') document.getElementById('world-city').classList.add('active');
            else if (type === 'town') document.getElementById('world-town').classList.add('active');
            else document.getElementById('world-village').classList.add('active');

            // Debug (opcjonalnie można usunąć w produkcji)
            console.log(`Setting World to: ${type} (${debugName})`);
        }

        // --- SEKWENCJA STARTOWA ---
        generateMetropolis(); // <--- GENERUJEMY MIASTO
        resetToNow();
        startClock();

        // Zamiast auto-startu GPS, dajemy zachętę
        locationNameEl.innerHTML = 'WARSZAWA <span style="opacity:0.5; font-size:9px; margin-left:5px;">(KLIKNIJ)</span>';
        updateWorldType('city', 'Default'); // Domyślna Warszawa to miasto
    </script>
    <script type="module">
        import { init } from '../src/core/Nucleus.js';
        init();
    </script>
