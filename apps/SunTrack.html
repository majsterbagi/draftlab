<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SunTrack | DraftLab.pl</title>

    <meta name="description" content="Solar path and golden hour tracker for photographers.">
    <meta name="theme-color" content="#0b0c0e">
    <link rel="manifest" href="./suntrack.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Fonts & Icons -->
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">

    <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>

    <!-- SunCalc Library -->
    <script type="module">
        import * as SunCalc from 'https://cdn.jsdelivr.net/npm/suncalc@2.0.0/+esm';
        window.SunCalc = SunCalc;
    </script>

    <!-- Styles & Core -->
    <link rel="stylesheet" href="../src/style.css">
    <script type="module" src="../src/main.js"></script>

    <!-- Styles -->

    <style>
        :root {
            --bg-color: #0b0c0e;
            --panel-bg: linear-gradient(160deg, rgba(24, 26, 31, 0.75), rgba(13, 14, 17, 0.65));
            --accent-color: #00ff9d;
            --text-color: #e0e0e0;
            --text-dim: rgba(255, 255, 255, 0.4);
            --grid-line: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.08);
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100dvh;
            padding-top: 0;
            /* Remove gap - header is absolute */
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* === SKY VISUALIZATION === */
        /* Ensure dl-header is visible above sky-container */
        dl-header {
            position: relative;
            z-index: 1000;
        }

        .sky-container {
            position: relative;
            width: 100%;
            height: calc(45vh + 50px + env(safe-area-inset-top));
            /* Include header area */
            padding-top: calc(50px + env(safe-area-inset-top));
            /* Push content below header */
            min-height: 280px;
            background: linear-gradient(180deg, #0f2027, #203a43, #2c5364);
            overflow: hidden;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .sky-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            opacity: 0.4;
        }

        .trajectory-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }


        .trajectory-season {
            fill: none;
            stroke-width: 1.5;
            stroke-dasharray: 4 3;
            opacity: 0.5;
            display: none;
        }

        .trajectory-season.active {
            display: block;
        }

        .trajectory-spring {
            stroke: #90ee90;
        }

        .trajectory-summer {
            stroke: #ffd700;
        }

        .trajectory-autumn {
            stroke: #ff8c00;
        }

        .trajectory-winter {
            stroke: #87ceeb;
        }

        /* === SEASON TOGGLE PANEL === */
        .season-panel {
            position: absolute;
            top: calc(60px + env(safe-area-inset-top));
            /* Account for safe area */
            right: 12px;
            transform: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1100;
            /* Above header (z-index: 1000) for clickability */
        }

        .season-toggle {
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            transition: all 0.2s;
        }

        .season-toggle:hover {
            background: rgba(0, 0, 0, 0.5);
        }

        .season-toggle input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        .season-toggle .icon {
            opacity: 0.4;
            font-size: 11px;
            transition: opacity 0.2s;
        }

        .season-toggle.active .icon {
            opacity: 1;
        }

        .season-toggle .label {
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            color: rgba(255, 255, 255, 0.4);
            transition: color 0.2s;
        }

        .season-toggle.active .label {
            color: rgba(255, 255, 255, 0.8);
        }

        /* === SKY SEARCH === */
        .sky-search {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sky-search-icon {
            color: rgba(255, 255, 255, 0.3);
        }

        .sky-search-input {
            background: transparent;
            border: none;
            outline: none;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            width: clamp(110px, 22vw, 180px);
            padding-right: 2px;
        }

        .location-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            flex: 0 0 24px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            color: rgba(255, 255, 255, 0.45);
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
        }

        .location-btn:hover,
        .location-btn:focus-visible {
            color: var(--accent-color);
            border-color: rgba(0, 255, 157, 0.45);
            background: rgba(0, 255, 157, 0.08);
        }

        .sky-search-input::-moz-placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .sky-search-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .sky-search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 4px;
            background: rgba(15, 16, 18, 0.95);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .sky-search-results.active {
            display: block;
        }

        .sky-search-result {
            width: 100%;
            display: block;
            text-align: left;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            border: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 12px;
            font: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        .sky-search-result:last-child {
            border-bottom: 0;
        }

        .sky-search-result:hover,
        .sky-search-result:focus-visible {
            background: rgba(0, 255, 157, 0.1);
            color: #fff;
        }

        .sky-search-status {
            padding: 10px 12px;
            color: var(--text-dim);
            font-size: 11px;
        }

        .sun-orb {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, 50%);
            box-shadow: 0 0 40px 15px rgba(255, 200, 100, 0.5);
            z-index: 5;
            transition: background 0.3s, box-shadow 0.3s, opacity 0.3s;
            /* Default position - center of sky, hidden until JS positions it */
            left: 50%;
            bottom: 50%;
            display: none;
        }

        .moon-orb {
            position: absolute;
            width: 32px;
            height: 32px;
            transform: translate(-50%, 50%);
            z-index: 4;
            display: none;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4));
        }

        .moon-orb svg {
            width: 100%;
            height: 100%;
        }

        .landscape {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            pointer-events: none;
            z-index: 4;
            /* Below Sun (5) for smooth rise without clipping */
        }

        .landscape svg {
            width: 100%;
            height: 100%;
        }

        /* === LENS FLARE === */
        .lens-flare {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            /* On top of everything */
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .flare-item {
            position: absolute;
            background: rgba(100, 255, 150, 0.4);
            border-radius: 50%;
            filter: blur(4px);
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
        }

        /* === SKY OVERLAY SLIDER === */
        .sky-slider-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 30;
        }

        .sky-slider-container {
            display: flex;
            align-items: center;
            gap: 16px;
            max-width: 800px;
            margin: 0 auto;
        }

        .sky-slider {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .sky-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--accent-color);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 255, 157, 0.5);
        }

        .sky-now-btn {
            padding: 6px 12px;
            background: rgba(0, 255, 157, 0.2);
            border: 1px solid rgba(0, 255, 157, 0.4);
            border-radius: 16px;
            color: var(--accent-color);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .sky-now-btn:hover {
            background: var(--accent-color);
            color: #000;
        }

        /* === DASHBOARD === */
        .dashboard {
            flex: 1;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
        }

        .date-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            backdrop-filter: blur(10px);
        }

        .date-control-label {
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .date-control-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .date-input {
            min-width: 132px;
            padding: 6px 8px;
            color: #fff;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 7px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color-scheme: dark;
        }

        .date-input:focus-visible {
            border-color: var(--accent-color);
            outline: 2px solid rgba(0, 255, 157, 0.15);
            outline-offset: 1px;
        }

        .today-btn {
            padding: 6px 9px;
            color: var(--accent-color);
            background: rgba(0, 255, 157, 0.08);
            border: 1px solid rgba(0, 255, 157, 0.28);
            border-radius: 7px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        .today-btn:hover,
        .today-btn:focus-visible {
            color: #000;
            background: var(--accent-color);
        }

        /* === SEARCH PANEL === */
        .search-panel {
            position: relative;
            margin-bottom: -10px;
            /* Pull tighter */
            z-index: 50;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(10px);
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(0, 255, 157, 0.15), 0 0 16px rgba(0, 255, 157, 0.1);
        }

        .search-input::-moz-placeholder {
            color: var(--text-dim);
        }

        .search-input::placeholder {
            color: var(--text-dim);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            pointer-events: none;
        }

        .stealth-trigger {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--text-dim);
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .stealth-trigger:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .search-results {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: rgba(20, 20, 24, 0.95);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            backdrop-filter: blur(10px);
        }

        .search-results.active {
            display: block;
        }

        .search-result-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            transition: background 0.2s;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background: rgba(0, 255, 157, 0.1);
        }

        /* === TIME DISPLAY === */
        .time-display {
            text-align: center;
            padding: 12px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .current-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -1px;
        }

        .current-date {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: left;
            line-height: 1.2;
        }

        .current-phase {
            display: inline-block;
            margin-top: 0;
            padding: 3px 10px;
            background: rgba(0, 255, 157, 0.1);
            border: 1px solid rgba(0, 255, 157, 0.3);
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* === STATS GRID === */
        .section-label {
            display: none;
            /* Hide label to save space */
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }



        /* === STATS GRID === */
        .section-label {
            display: none;
            /* Hide label to save space */
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 12px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            border-color: rgba(0, 255, 157, 0.3);
            box-shadow: 0 0 12px rgba(0, 255, 157, 0.12);
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .stat-sub {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        /* === SLIDER PANEL === */
        .slider-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 16px;
            backdrop-filter: blur(10px);
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .slider-label {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .now-btn {
            padding: 6px 14px;
            background: rgba(0, 255, 157, 0.1);
            border: 1px solid rgba(0, 255, 157, 0.3);
            border-radius: 20px;
            color: var(--accent-color);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .now-btn:hover {
            background: var(--accent-color);
            color: #000;
        }

        /* Fix trajectory consistency */
        /* .stealth-mode .trajectory-season override removed to match standard thickness */

        /* Stealth Mode System */
        .stealth-mode .season-panel {
            display: flex !important;
            position: fixed !important;
            top: 30% !important;
            right: 20px !important;
            bottom: auto !important;
            z-index: 2005;
        }

        /* Make season toggles subtle in stealth mode */
        .stealth-mode .season-toggle:not(#stealth-trigger) {
            opacity: 0.4;
            transition: opacity 0.2s;
        }

        .stealth-mode .season-toggle:not(#stealth-trigger):hover {
            opacity: 0.9;
        }

        #stealth-trigger {
            display: none;
            /* Disabled - feature needs work */
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        #stealth-trigger:hover {
            opacity: 1;
        }

        /* Stealth Mode Dashboard Overlay - Transparent with Glass Effect */
        .stealth-mode .dashboard {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95), transparent) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: none !important;
            pointer-events: auto;
            padding-bottom: 40px;
        }

        /* Restore visibility of all elements */
        .stealth-mode .stats-grid,
        .stealth-mode .section-label {
            display: grid !important;
        }

        .stealth-mode .section-label {
            display: block !important;
            opacity: 0.5;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* Glass Cards */
        .stealth-mode .stat-card,
        .stealth-mode .time-display {
            background: rgba(10, 12, 16, 0.4) !important;
            backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4) !important;
        }

        .stealth-mode .stat-value,
        .stealth-mode .current-time {
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* Slider visible transparent */
        .stealth-mode .sky-slider-overlay {
            display: flex !important;
            background: transparent !important;
            border-top: none !important;
            backdrop-filter: none !important;
        }

        /* === FOOTER === */
        .footer-info {
            text-align: center;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.2);
            padding: 16px 0;
            font-family: 'JetBrains Mono', monospace;
        }

        /* === STEALTH MODE === */
        body.stealth-mode {
            padding-top: 0;
            overflow: hidden;
        }

        .stealth-mode dl-overlay-header,
        .stealth-mode .footer-info {
            display: none !important;
        }

        /* Stealth mode: expanded view to show sun below horizon */
        .stealth-mode .sky-container {
            height: 100dvh;
        }

        /* Stealth mode landscape: SINGLE HORIZON LINE */
        .stealth-mode .landscape {
            bottom: auto;
            top: calc(var(--std-sky-height) - 1px);
            height: 1px !important;
            background: rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }

        .stealth-mode .landscape svg {
            display: none;
        }

        /* Dashed horizon line removed for cleaner look matching standard mode */
        .stealth-mode .sky-container::after {
            display: none;
        }

        /* Keep sun visible when below horizon */
        .stealth-mode .sun-orb {
            z-index: 10;
        }

        /* === RESPONSIVE === */
        @media (max-width: 480px) {
            .date-control {
                align-items: flex-start;
                flex-direction: column;
            }

            .date-control-actions {
                width: 100%;
            }

            .date-input {
                flex: 1;
            }

            .current-time {
                font-size: 40px;
            }

            .stat-value {
                font-size: 16px;
            }

            .stats-grid {
                gap: 8px;
            }

        <script>
            let LAT = 52.2297; // Default: Warsaw
            let LNG = 21.0122;
            let isLive = true;
            let stealthMode = localStorage.getItem('suntrack_stealth') === 'true';
            let searchTimeout = null;
            let searchAbortController = null;
            let searchRequestId = 0;
            let selectedDateKey = '';
            let locationSource = 'default';
            let initialized = false;

            let savedToggleStates = null;

            const getDateKey = (date = new Date()) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const parseDateKey = (dateKey) => {
                const [year, month, day] = String(dateKey).split('-').map(Number);
                if (![year, month, day].every(Number.isFinite)) return null;
                const date = new Date(year, month - 1, day);
                date.setHours(0, 0, 0, 0);
                return Number.isNaN(date.getTime()) ? null : date;
            };

            // Expose update function for i18n subscription
            window.updateApp = () => {
                const slider = document.getElementById('sky-slider');
                if (slider) update(parseInt(slider.value, 10));
            };

            // Subscribe to language changes
            window.addEventListener('load', () => {
                if (window.i18n) {
                    window.i18n.subscribe(() => {
                        window.i18n.updateStaticElements();
                        window.updateApp();
                    });
                }
            });

            function toggleStealthMode() {
                stealthMode = !stealthMode;
                document.body.classList.toggle('stealth-mode', stealthMode);
                localStorage.setItem('suntrack_stealth', stealthMode);

                const icon = document.getElementById('stealth-icon-panel');
                if (stealthMode) {
                    icon.setAttribute('data-lucide', 'eye-off');
                    icon.style.color = '#ff6b6b';

                    // Save current toggle states before enabling all
                    savedToggleStates = {
                        spring: toggleSpring.checked,
                        summer: toggleSummer.checked,
                        autumn: toggleAutumn.checked,
                        winter: toggleWinter.checked
                    };

                    // Enable all trajectories in stealth mode
                    toggleSpring.checked = true;
                    toggleSummer.checked = true;
                    toggleAutumn.checked = true;
                    toggleAutumn.checked = true;
                    toggleWinter.checked = true;
                } else {
                    icon.setAttribute('data-lucide', 'eye');
                    icon.style.color = '#00ff9d';

                    // Restore previous toggle states
                    if (savedToggleStates) {
                        toggleSpring.checked = savedToggleStates.spring;
                        toggleSummer.checked = savedToggleStates.summer;
                        toggleAutumn.checked = savedToggleStates.autumn;
                        toggleWinter.checked = savedToggleStates.winter;
                    }
                }
                initSeasonToggles();

                // Force redraw and ensure layout is calculated
                requestAnimationFrame(() => {
                    drawSeasonalTrajectories();
                    update(parseInt(skySlider.value));
                });

                lucide.createIcons();
            }

            // === DOM REFS ===
            const skyContainer = document.getElementById('sky-container');
            const sunOrb = document.getElementById('sun-orb');
            const moonOrb = document.getElementById('moon-orb');
            const skySlider = document.getElementById('sky-slider');
            const skyNowBtn = document.getElementById('sky-now-btn');
            const citySearch = document.getElementById('city-search');
            const useLocationBtn = document.getElementById('use-location-btn');
            const dateInput = document.getElementById('sun-date');
            const todayBtn = document.getElementById('today-btn');

            const lensFlare = document.getElementById('lens-flare');
            const flareItems = document.querySelectorAll('.flare-item');
            const searchResults = document.getElementById('search-results');

            // Seasonal trajectory refs
            const trajectorySpring = document.getElementById('trajectory-spring');
            const trajectorySummer = document.getElementById('trajectory-summer');
            const trajectoryAutumn = document.getElementById('trajectory-autumn');
            const trajectoryWinter = document.getElementById('trajectory-winter');
            const toggleSpring = document.querySelector('label[data-season="spring"] input');
            const toggleSummer = document.querySelector('label[data-season="summer"] input');
            const toggleAutumn = document.querySelector('label[data-season="autumn"] input');
            const toggleWinter = document.querySelector('label[data-season="winter"] input');

            const isValidDate = (date) => date instanceof Date && !Number.isNaN(date.getTime());
            const getAzimuthDegrees = (position) => {
                if (!position || !Number.isFinite(position.azimuth)) return null;
                return ((position.azimuth % 360) + 360) % 360;
            };

            // SunCalc 2 returns degrees clockwise from north.
            // Render the whole horizon as a 360° panorama: N | E | S | W | N.
            const projectSkyPosition = (position, { horizonY, skyRange }) => {
                const azimuth = getAzimuthDegrees(position);
                const altitude = position && Number.isFinite(position.altitude)
                    ? position.altitude
                    : null;

                return {
                    azimuth,
                    altitude,
                    x: azimuth === null ? 50 : (azimuth / 360) * 100,
                    bottom: altitude === null ? horizonY : horizonY + (altitude / 90) * skyRange
                };
            };

            const readSavedLocation = () => {
                const savedLat = localStorage.getItem('suntrack_lat');
                const savedLng = localStorage.getItem('suntrack_lng');
                if (savedLat === null || savedLng === null || savedLat.trim() === '' || savedLng.trim() === '') {
                    return null;
                }

                const lat = Number(savedLat);
                const lng = Number(savedLng);
                if (!Number.isFinite(lat) || !Number.isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) {
                    return null;
                }

                return {
                    lat,
                    lng,
                    city: localStorage.getItem('suntrack_city') || 'Warszawa',
                    source: localStorage.getItem('suntrack_location_source') || 'legacy'
                };
            };

            const saveLocation = ({ lat, lng, city, source }) => {
                LAT = lat;
                LNG = lng;
                locationSource = source;
                localStorage.setItem('suntrack_lat', String(lat));
                localStorage.setItem('suntrack_lng', String(lng));
                if (city) {
                    localStorage.setItem('suntrack_city', city);
                    if (citySearch) citySearch.value = city;
                }
                localStorage.setItem('suntrack_location_source', source);
            };

            // Configuration - Dynamic calculation to match standard mode pixels
            const getHorizonConfig = () => {
                const container = document.getElementById('sky-container');
                const vh = container ? container.clientHeight : window.innerHeight;

                // Standard height calc
                const stdHeight = Math.max(window.innerHeight * 0.45, 280);

                // Set CSS variable for Standard Height (used by Landscape in Stealth Mode)
                if (container) {
                    container.style.setProperty('--std-sky-height', `${stdHeight}px`);
                }

                // Standard config
                const stdHorizonY = 18; // 18% from bottom
                const stdSkyRange = 70;

                if (!stealthMode) return { horizonY: stdHorizonY, skyRange: stdSkyRange };

                // Stealth mode: dynamic calibration based on REAL container height

                // 1. Calculate Standard Horizon Position (pixels from TOP)
                const horizonPxFromTop = stdHeight * (1 - (stdHorizonY / 100));

                // 2. Calculate New Horizon Y (pixels from BOTTOM of Stealth Container)
                const horizonPxFromBottomStealth = vh - horizonPxFromTop;
                const newHorizonY = (horizonPxFromBottomStealth / vh) * 100;

                // Update CSS variable for the horizon line (if we were using it, but we might repurpose/remove usage)
                if (container) {
                    container.style.setProperty('--stealth-horizon-y', `${newHorizonY}%`);
                }

                // 3. Calculate New Sky Range (Amplitude)
                const amplitudePx = stdHeight * (stdSkyRange / 100);
                const newSkyRange = (amplitudePx / vh) * 100;

                return { horizonY: newHorizonY, skyRange: newSkyRange };
            };

            // === HELPERS ===
            const fmt = date => isValidDate(date)
                ? date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0')
                : '--:--';

            const fmtDateDiff = (ms) => {
                if (!Number.isFinite(ms) || ms < 0) return '--';
                const h = Math.floor(ms / 3600000);
                const m = Math.floor((ms % 3600000) / 60000);
                return `${h}h ${m}m`;
            };

            const fmtRange = (start, end) => (!isValidDate(start) || !isValidDate(end))
                ? '--:--'
                : `${fmt(start)} - ${fmt(end)}`;

            // === SKY GRADIENT ===
            // === SKY GRADIENT (Smooth Interpolation) ===
            function lerpColor(a, b, amount) {
                const ah = parseInt(a.replace(/#/g, ''), 16),
                    ar = ah >> 16, ag = ah >> 8 & 0xff, ab = ah & 0xff,
                    bh = parseInt(b.replace(/#/g, ''), 16),
                    br = bh >> 16, bg = bh >> 8 & 0xff, bb = bh & 0xff,
                    rr = ar + amount * (br - ar),
                    rg = ag + amount * (bg - ag),
                    rb = ab + amount * (bb - ab);
                return '#' + ((1 << 24) + (rr << 16) + (rg << 8) + rb | 0).toString(16).slice(1);
            }

            function updateFlare(sunX, sunY, sunOpacity) {
                if (sunOpacity <= 0.1) {
                    lensFlare.style.opacity = 0;
                    return;
                }
                lensFlare.style.opacity = sunOpacity * 0.8; // Max 0.8 opacity

                // Center of screen
                const cx = 50;
                const cy = 50;

                // Vector from sun to center
                const dx = cx - sunX;
                const dy = cy - sunY;

                // Position flares along this vector (with existence checks)
                // Flare 1: 0.5 distance
                if (flareItems[0]) {
                    flareItems[0].style.left = (cx + dx * 0.3) + '%';
                    flareItems[0].style.top = (cy + dy * 0.3) + '%';
                }

                // Flare 2: 1.2 distance (past center)
                if (flareItems[1]) {
                    flareItems[1].style.left = (cx - dx * 0.4) + '%';
                    flareItems[1].style.top = (cy - dy * 0.4) + '%';
                }

                // Flare 3: 2.0 distance
                if (flareItems[2]) {
                    flareItems[2].style.left = (cx - dx * 1.5) + '%';
                    flareItems[2].style.top = (cy - dy * 1.5) + '%';
                }
            }

            // Keyframes for sky gradient based on solar altitude


            const skyKeyframes = [
                { alt: 90, colors: { top: '#1a3a5c', mid: '#4a90b8', bottom: '#87ceeb' } },  // Noon
                { alt: 20, colors: { top: '#1a3a5c', mid: '#4a90b8', bottom: '#87ceeb' } },  // Day
                { alt: 6, colors: { top: '#1a2a3a', mid: '#d4a574', bottom: '#f4c28f' } },   // Golden Hour Start
                { alt: -2, colors: { top: '#2a3a55', mid: '#d48a6e', bottom: '#f4a27f' } },  // Just below horizon (Pre-sunrise glow)
                { alt: -6, colors: { top: '#152033', mid: '#506080', bottom: '#90a0c0' } },  // Civil Twilight (Brighter)
                { alt: -12, colors: { top: '#0a1020', mid: '#253045', bottom: '#405070' } }, // Nautical Twilight (Visible light)
                { alt: -18, colors: { top: '#020408', mid: '#0a0f1a', bottom: '#151c29' } }  // Night
            ];

            function getGradient(altDeg) {
                // Find two keyframes to interpolate between
                let start = skyKeyframes[0];
                let end = skyKeyframes[skyKeyframes.length - 1];

                for (let i = 0; i < skyKeyframes.length - 1; i++) {
                    if (altDeg <= skyKeyframes[i].alt && altDeg >= skyKeyframes[i + 1].alt) {
                        start = skyKeyframes[i];
                        end = skyKeyframes[i + 1];
                        break;
                    }
                }

                // If above highest or below lowest, clamp
                if (altDeg > start.alt) return start.colors;
                if (altDeg < end.alt) return end.colors;

                // Calculate interpolation factor (0 to 1)
                const range = start.alt - end.alt;
                const progress = start.alt - altDeg;
                const t = progress / range;

                return {
                    top: lerpColor(start.colors.top, end.colors.top, t),
                    mid: lerpColor(start.colors.mid, end.colors.mid, t),
                    bottom: lerpColor(start.colors.bottom, end.colors.bottom, t)
                };
            }

            // === MOON PHASE RENDERING ===
            // Renders the moon phase as an SVG shadow overlay
            function updateMoonPhase(date) {
                const moonPhasePath = document.getElementById('moon-phase-shadow');
                if (!moonPhasePath) return;

                // Get moon illumination data from SunCalc
                const illumination = SunCalc.getMoonIllumination(date);
                const phase = illumination.phase; // 0 = new moon, 0.5 = full moon, 1 = new moon

                // Calculate shadow path based on phase
                // phase 0-0.25: waxing crescent (shadow on left, moving right)
                // phase 0.25-0.5: waxing gibbous (shadow on left, shrinking)
                // phase 0.5: full moon (no shadow)
                // phase 0.5-0.75: waning gibbous (shadow on right, growing)
                // phase 0.75-1: waning crescent (shadow on right, moving left)

                const cx = 50, cy = 50, r = 48;

                // No shadow needed for full moon (phase ~0.5)
                if (phase > 0.48 && phase < 0.52) {
                    moonPhasePath.setAttribute('d', '');
                    return;
                }

                // For new moon (phase ~0 or ~1), cover entire moon
                if (phase < 0.02 || phase > 0.98) {
                    moonPhasePath.setAttribute('d', `M ${cx - r},${cy} A ${r},${r} 0 1,1 ${cx + r},${cy} A ${r},${r} 0 1,1 ${cx - r},${cy}`);
                    return;
                }

                // Calculate the terminator curve
                // The terminator is the boundary between light and dark
                let illuminatedFraction;
                let shadowFromRight;

                if (phase < 0.5) {
                    // Waxing: shadow on left (light coming from right)
                    illuminatedFraction = phase * 2; // 0 to 1 as phase goes 0 to 0.5
                    shadowFromRight = false;
                } else {
                    // Waning: shadow on right (light coming from left)
                    illuminatedFraction = (1 - phase) * 2; // 1 to 0 as phase goes 0.5 to 1
                    shadowFromRight = true;
                }

                // Calculate ellipse width based on illumination
                // When illuminatedFraction = 0, shadow covers all (full ellipse)
                // When illuminatedFraction = 0.5, terminator is straight line
                // When illuminatedFraction = 1, no shadow (full moon)

                const terminatorX = r * (2 * illuminatedFraction - 1); // -r to +r

                let path;
                if (shadowFromRight) {
                    // Shadow on right side
                    if (illuminatedFraction < 0.5) {
                        // More than half in shadow - use two arcs
                        path = `M ${cx},${cy - r} 
                                A ${r},${r} 0 0,0 ${cx},${cy + r} 
                                A ${Math.abs(terminatorX)},${r} 0 0,${terminatorX < 0 ? 0 : 1} ${cx},${cy - r}`;
                    } else {
                        // Less than half in shadow
                        path = `M ${cx},${cy - r} 
                                A ${r},${r} 0 0,0 ${cx},${cy + r} 
                                A ${Math.abs(terminatorX)},${r} 0 0,0 ${cx},${cy - r}`;
                    }
                } else {
                    // Shadow on left side
                    if (illuminatedFraction < 0.5) {
                        // More than half in shadow
                        path = `M ${cx},${cy - r} 
                                A ${r},${r} 0 0,1 ${cx},${cy + r} 
                                A ${Math.abs(terminatorX)},${r} 0 0,${terminatorX < 0 ? 1 : 0} ${cx},${cy - r}`;
                    } else {
                        // Less than half in shadow
                        path = `M ${cx},${cy - r} 
                                A ${r},${r} 0 0,1 ${cx},${cy + r} 
                                A ${Math.abs(terminatorX)},${r} 0 0,1 ${cx},${cy - r}`;
                    }
                }

                moonPhasePath.setAttribute('d', path);
            }

            // === UPDATE FUNCTION ===
            function update(mins, dateKey = selectedDateKey) {
                const safeMins = Math.max(0, Math.min(1439, Number.isFinite(mins) ? mins : 0));
                const h = Math.floor(safeMins / 60);
                const m = Math.floor(safeMins % 60);
                const d = parseDateKey(dateKey) || parseDateKey(getDateKey()) || new Date();
                d.setHours(h, m, 0, 0);

                const text = (key) => window.i18n ? window.i18n.t(key) : key;
                const setText = (id, value) => {
                    const element = document.getElementById(id);
                    if (element) element.textContent = value;
                };

                selectedDateKey = getDateKey(d);
                if (dateInput && dateInput.value !== selectedDateKey) dateInput.value = selectedDateKey;

                // Time display
                const timeStr = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
                document.querySelectorAll('.current-time').forEach(el => el.textContent = timeStr);

                // Date
                const lang = (window.i18n && window.i18n.lang) || 'pl';
                const locale = lang === 'en' ? 'en-US' : 'pl-PL';
                const dateStr = d.toLocaleDateString(locale, { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase();
                document.querySelectorAll('.current-date').forEach(el => el.textContent = dateStr);

                // Sun calculations
                const times = SunCalc.getTimes(d, LAT, LNG);
                const pos = SunCalc.getPosition(d, LAT, LNG);
                const altDeg = pos.altitude;
                const sunrise = isValidDate(times.sunrise) ? times.sunrise : null;
                const sunset = isValidDate(times.sunset) ? times.sunset : null;
                const solarNoon = isValidDate(times.solarNoon) ? times.solarNoon : null;
                const polarState = text(altDeg >= 0 ? 'sun.state.polar_day' : 'sun.state.polar_night');

                // Phase
                let phaseKey = 'sun.phase.night';
                if (altDeg > 6) phaseKey = 'sun.phase.day';
                else if (altDeg > -4) phaseKey = 'sun.phase.golden';
                else if (altDeg > -12) phaseKey = 'sun.phase.blue';
                document.querySelectorAll('.current-phase').forEach(el => el.textContent = text(phaseKey));

                // Stats
                setText('val-sunrise', sunrise ? fmt(sunrise) : polarState);
                setText('val-sunset', sunset ? fmt(sunset) : polarState);
                setText('val-golden-am', fmtRange(sunrise, times.goldenHourEnd));
                setText('val-golden-pm', fmtRange(times.goldenHour, sunset));
                setText('val-noon', solarNoon ? fmt(solarNoon) : '--:--');

                // Azimuth/Elevation
                const risePos = sunrise ? SunCalc.getPosition(sunrise, LAT, LNG) : null;
                const setPos = sunset ? SunCalc.getPosition(sunset, LAT, LNG) : null;
                const noonPos = solarNoon ? SunCalc.getPosition(solarNoon, LAT, LNG) : null;
                const azDegRise = getAzimuthDegrees(risePos);
                const azDegSet = getAzimuthDegrees(setPos);
                const noonElev = noonPos && Number.isFinite(noonPos.altitude) ? noonPos.altitude : null;

                setText('val-az-rise', azDegRise === null ? '--' : Math.round(azDegRise));
                setText('val-az-set', azDegSet === null ? '--' : Math.round(azDegSet));
                setText('val-elev', noonElev === null ? '--' : Math.round(noonElev));

                // Day Length and comparison with the local hemisphere's longest day
                const dayLenMs = sunrise && sunset ? sunset.getTime() - sunrise.getTime() : null;
                if (Number.isFinite(dayLenMs) && dayLenMs >= 0) {
                    setText('val-len', fmtDateDiff(dayLenMs));

                    const currentYear = d.getFullYear();
                    const longestDay = LAT >= 0
                        ? new Date(currentYear, 5, 21)
                        : new Date(currentYear, 11, 21);
                    const longestTimes = SunCalc.getTimes(longestDay, LAT, LNG);
                    const longestSunrise = isValidDate(longestTimes.sunrise) ? longestTimes.sunrise : null;
                    const longestSunset = isValidDate(longestTimes.sunset) ? longestTimes.sunset : null;
                    const longestLen = longestSunrise && longestSunset
                        ? longestSunset.getTime() - longestSunrise.getTime()
                        : null;

                    if (Number.isFinite(longestLen) && longestLen >= dayLenMs) {
                        const diff = longestLen - dayLenMs;
                        setText('val-diff', diff < 60000 ? '0h 0m' : `-${fmtDateDiff(diff)}`);
                    } else {
                        setText('val-diff', '--');
                    }
                } else {
                    setText('val-len', polarState);
                    setText('val-diff', '--');
                }

                // Sky gradient
                const grad = getGradient(altDeg);

                if (stealthMode) {
                    // In stealth mode, we allow the gradient to extend.
                    // However, to keep the "horizon" visual, we can mirror or darken the bottom.
                    // User requested sky color to be BELOW horizon too.
                    // So we just use the full gradient but maybe stretched or repeated.

                    // Simpler approach: Just use the standard gradient covering the full 100vh area
                    // but ensuring the "Horizon" color (bottom of grad) sits roughly at the horizon line
                    // and then perhaps fades out or continues below.

                    const { horizonY } = getHorizonConfig();
                    const horizonStop = 100 - horizonY;

                    // We stretch the 'mid' and 'bottom' parts to cover the extended area
                    skyContainer.style.background = `linear-gradient(180deg, 
                    ${grad.top} 0%, 
                    ${grad.mid} ${horizonStop * 0.4}%, 
                    ${grad.bottom} ${horizonStop}%, 
                    ${grad.bottom} 100%)`;
                } else {
                    skyContainer.style.background = `linear-gradient(180deg, ${grad.top}, ${grad.mid}, ${grad.bottom})`;
                }

                // Layout Tuning
                const { horizonY, skyRange } = getHorizonConfig();
                const sunProjection = projectSkyPosition(pos, { horizonY, skyRange });
                const xPercent = sunProjection.x;

                let yPercent = sunProjection.bottom;
                // In stealth mode, allow sun to go much further below horizon
                const minY = stealthMode ? -60 : -20;
                yPercent = Math.max(minY, Math.min(120, yPercent));

                sunOrb.style.left = xPercent + '%';
                sunOrb.style.bottom = yPercent + '%';
                sunOrb.dataset.azimuth = sunProjection.azimuth?.toFixed(4) ?? '';
                sunOrb.dataset.altitude = sunProjection.altitude?.toFixed(4) ?? '';

                // Sun visibility & Opacity
                // -0.833° is the standard sunrise/sunset altitude used by SunCalc
                // (the upper edge of the solar disc touches the horizon).
                const isSunVisible = altDeg >= -0.833 || stealthMode;
                if (isSunVisible) {
                    sunOrb.style.display = 'block';
                    // Opacity logic:
                    // Below horizon (< 0): faint (0.2 - 0.5)
                    // Above horizon (>= 0): full (1.0)
                    let opacity;
                    if (altDeg < 0) {
                        // From -18 (night) to 0 (horizon), opacity goes 0.1 -> 0.5
                        opacity = 0.1 + Math.max(0, (altDeg + 18) / 18) * 0.4;
                    } else {
                        opacity = 1;
                    }

                    sunOrb.style.opacity = opacity;

                    if (altDeg < 4) {
                        sunOrb.style.background = altDeg < -2 ? '#ff6b6b' : '#ffb347'; // Redder when deep under
                        sunOrb.style.boxShadow = `0 0 50px 20px rgba(255, 140, 50, ${0.6 * opacity})`;
                    } else {
                        sunOrb.style.background = '#fff';
                        sunOrb.style.boxShadow = `0 0 40px 15px rgba(255, 200, 100, ${0.5 * opacity})`;
                    }

                    updateFlare(xPercent, 100 - yPercent, altDeg > -2 ? opacity : 0);
                } else {
                    sunOrb.style.display = 'none';
                    lensFlare.style.opacity = 0;
                }

                // The Moon can be above the horizon during the day, so its visibility
                // depends on its own altitude rather than the Sun's altitude.
                const moonPos = SunCalc.getMoonPosition(d, LAT, LNG);
                const moonProjection = projectSkyPosition(moonPos, { horizonY, skyRange });
                const moonAlt = moonProjection.altitude;
                const moonY = Math.max(stealthMode ? -60 : -20, Math.min(120, moonProjection.bottom));

                moonOrb.style.left = moonProjection.x + '%';
                moonOrb.style.bottom = moonY + '%';
                moonOrb.dataset.azimuth = moonProjection.azimuth?.toFixed(4) ?? '';
                moonOrb.dataset.altitude = moonProjection.altitude?.toFixed(4) ?? '';

                if (moonAlt !== null && moonAlt >= 0) {
                    moonOrb.style.display = 'block';
                } else {
                    moonOrb.style.display = 'none';
                }

                // Keep the phase current even while the Moon is below the horizon.
                updateMoonPhase(d);
            }

            // === SEASONAL TRAJECTORIES ===
            function drawSeasonalTrajectories() {
                const currentYear = parseDateKey(selectedDateKey)?.getFullYear() || new Date().getFullYear();
                const seasonDates = {
                    spring: new Date(currentYear, 2, 21),  // Mar 21
                    summer: new Date(currentYear, 5, 21),  // Jun 21
                    autumn: new Date(currentYear, 8, 23),  // Sep 23
                    winter: new Date(currentYear, 11, 21)  // Dec 21
                };

                const { horizonY: horizonSVG, skyRange: skyRangeSVG } = getHorizonConfig();

                Object.entries(seasonDates).forEach(([season, date]) => {
                    const times = SunCalc.getTimes(date, LAT, LNG);
                    const path = document.getElementById(`trajectory-${season}`);
                    if (!path || !isValidDate(times.sunrise) || !isValidDate(times.sunset)) {
                        if (path) path.setAttribute('d', '');
                        return;
                    }

                    const start = times.sunrise.getTime();
                    const end = times.sunset.getTime();
                    const step = 5 * 60 * 1000;
                    let pathData = '';
                    let previousX = null;

                    const appendPosition = (position) => {
                        const projection = projectSkyPosition(position, {
                            horizonY: horizonSVG,
                            skyRange: skyRangeSVG
                        });
                        const x = projection.x;
                        const y = 100 - projection.bottom;
                        const crossesPanoramaSeam = previousX !== null && Math.abs(x - previousX) > 50;
                        const command = !pathData || crossesPanoramaSeam ? 'M' : 'L';

                        pathData += `${command} ${x} ${y} `;
                        previousX = x;
                    };

                    for (let timestamp = start; timestamp <= end; timestamp += step) {
                        const testDate = new Date(timestamp);
                        const pos = SunCalc.getPosition(testDate, LAT, LNG);
                        appendPosition(pos);
                    }

                    if ((end - start) % step !== 0) {
                        const testDate = new Date(end);
                        const pos = SunCalc.getPosition(testDate, LAT, LNG);
                        appendPosition(pos);
                    }

                    path.setAttribute('d', pathData.trim());
                    path.dataset.referenceDate = getDateKey(date);
                });
            }

            let seasonTogglesInitialized = false;

            function initSeasonToggles() {
                const toggles = {
                    spring: { toggle: toggleSpring, path: trajectorySpring, label: document.getElementById('toggle-spring-label') },
                    summer: { toggle: toggleSummer, path: trajectorySummer, label: document.getElementById('toggle-summer-label') },
                    autumn: { toggle: toggleAutumn, path: trajectoryAutumn, label: document.getElementById('toggle-autumn-label') },
                    winter: { toggle: toggleWinter, path: trajectoryWinter, label: document.getElementById('toggle-winter-label') }
                };

                Object.entries(toggles).forEach(([season, { toggle, path, label }]) => {
                    // Load from localStorage and sync visual state
                    const saved = localStorage.getItem(`suntrack-${season}`);
                    if (saved === 'true') {
                        toggle.checked = true;
                        path.classList.add('active');
                        label.classList.add('active');
                    } else {
                        path.classList.toggle('active', toggle.checked);
                        label.classList.toggle('active', toggle.checked);
                    }

                    // Add event listeners only once
                    if (!seasonTogglesInitialized) {
                        toggle.addEventListener('change', () => {
                            console.log(`SEASON TOGGLE: ${season} -> ${toggle.checked}`);
                            path.classList.toggle('active', toggle.checked);
                            label.classList.toggle('active', toggle.checked);
                            localStorage.setItem(`suntrack-${season}`, toggle.checked);
                            if (toggle.checked) {
                                try {
                                    drawSeasonalTrajectories();
                                } catch (e) {
                                    console.error("Error drawing trajectory:", e);
                                }
                            }
                        });
                    }
                });

                seasonTogglesInitialized = true;

                // Draw if any active
                if (Object.values(toggles).some(({ toggle }) => toggle.checked)) {
                    drawSeasonalTrajectories();
                }
            }

            // === LOCATION SEARCH ===
            const setSearchVisibility = (visible) => {
                if (!searchResults) return;
                searchResults.classList.toggle('active', visible);
                if (citySearch) citySearch.setAttribute('aria-expanded', String(visible));
            };

            const renderSearchStatus = (translationKey) => {
                if (!searchResults) return;
                searchResults.replaceChildren();
                const status = document.createElement('div');
                status.className = 'sky-search-status';
                status.setAttribute('role', 'status');
                status.textContent = window.i18n ? window.i18n.t(translationKey) : translationKey;
                searchResults.appendChild(status);
                setSearchVisibility(true);
            };

            const renderSearchResults = (items) => {
                if (!searchResults) return;
                searchResults.replaceChildren();

                if (!items.length) {
                    renderSearchStatus('sun.search.no_results');
                    return;
                }

                items.slice(0, 5).forEach(item => {
                    const result = document.createElement('button');
                    result.type = 'button';
                    result.className = 'sky-search-result';
                    result.setAttribute('role', 'option');
                    result.dataset.lat = item.lat;
                    result.dataset.lon = item.lon;
                    result.dataset.city = item.name || item.display_name.split(',')[0].trim();
                    result.textContent = item.display_name;
                    searchResults.appendChild(result);
                });

                setSearchVisibility(true);
            };

            async function searchCity(query) {
                const normalizedQuery = query.trim();
                if (normalizedQuery.length < 2) {
                    setSearchVisibility(false);
                    return;
                }

                searchAbortController?.abort();
                searchAbortController = new AbortController();
                const requestId = ++searchRequestId;
                renderSearchStatus('sun.search.loading');

                try {
                    const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&q=${encodeURIComponent(normalizedQuery)}`;
                    const resp = await fetch(url, {
                        signal: searchAbortController.signal,
                        headers: { Accept: 'application/json' }
                    });
                    if (!resp.ok) throw new Error(`Location search failed: ${resp.status}`);
                    const data = await resp.json();
                    if (requestId !== searchRequestId) return;
                    renderSearchResults(Array.isArray(data) ? data : []);
                } catch (e) {
                    if (e.name === 'AbortError' || requestId !== searchRequestId) return;
                    console.error('Search error:', e);
                    renderSearchStatus('sun.search.error');
                }
            }

            async function reverseGeocode(lat, lng) {
                const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&lat=${lat}&lon=${lng}`, {
                    headers: { Accept: 'application/json' }
                });
                if (!resp.ok) throw new Error(`Reverse geocoding failed: ${resp.status}`);
                const data = await resp.json();
                const address = data.address || {};
                return address.city || address.town || address.village || address.municipality || 'Lokalizacja';
            }

            function requestCurrentLocation(showStatus = true) {
                if (showStatus) renderSearchStatus('sun.search.loading');

                if (!navigator.geolocation) {
                    if (showStatus) renderSearchStatus('sun.search.error');
                    if (!initialized) init();
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const provisionalCity = citySearch?.value || 'Lokalizacja';

                        // Apply coordinates immediately; reverse geocoding should not block the dashboard.
                        saveLocation({ lat, lng, city: provisionalCity, source: 'geolocation' });
                        setSearchVisibility(false);
                        if (!initialized) init();
                        else if (skySlider) update(parseInt(skySlider.value, 10));

                        try {
                            const city = await reverseGeocode(lat, lng);
                            saveLocation({ lat, lng, city, source: 'geolocation' });
                        } catch (e) {
                            console.warn('Geocoding failed:', e);
                        }
                    },
                    (err) => {
                        console.warn('Geolocation denied:', err);
                        if (showStatus) {
                            renderSearchStatus('sun.search.error');
                            setTimeout(() => setSearchVisibility(false), 3500);
                        }
                        if (!initialized) init();
                    },
                    { timeout: 5000, maximumAge: 300000 }
                );
            }

            // === EVENTS ===
            if (citySearch) {
                citySearch.addEventListener('input', (e) => {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => searchCity(e.target.value), 450);
                });
                citySearch.addEventListener('blur', () => {
                    setTimeout(() => setSearchVisibility(false), 200);
                });
                citySearch.addEventListener('keydown', (event) => {
                    if (event.key === 'Escape') {
                        setSearchVisibility(false);
                        citySearch.blur();
                    }
                });
            }

            if (searchResults) {
                searchResults.addEventListener('mousedown', (event) => event.preventDefault());
                searchResults.addEventListener('click', (event) => {
                    const result = event.target.closest('.sky-search-result');
                    if (!result) return;

                    const lat = Number(result.dataset.lat);
                    const lng = Number(result.dataset.lon);
                    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

                    saveLocation({
                        lat,
                        lng,
                        city: result.dataset.city || result.textContent.trim().split(',')[0],
                        source: 'manual'
                    });
                    setSearchVisibility(false);
                    if (skySlider) update(parseInt(skySlider.value, 10));
                });
            }

            if (useLocationBtn) {
                useLocationBtn.addEventListener('click', () => requestCurrentLocation(true));
            }

            if (dateInput) {
                dateInput.addEventListener('change', (event) => {
                    const nextDate = parseDateKey(event.target.value);
                    if (!nextDate) return;
                    selectedDateKey = getDateKey(nextDate);
                    isLive = false;
                    if (skySlider) update(parseInt(skySlider.value, 10), selectedDateKey);
                });
            }

            if (todayBtn) {
                todayBtn.addEventListener('click', () => {
                    const now = new Date();
                    selectedDateKey = getDateKey(now);
                    isLive = true;
                    if (dateInput) dateInput.value = selectedDateKey;
                    if (skySlider) {
                        skySlider.value = now.getHours() * 60 + now.getMinutes();
                        update(parseInt(skySlider.value, 10), selectedDateKey);
                    }
                });
            }

            if (skySlider) {
                skySlider.addEventListener('input', (e) => {
                    isLive = false;
                    update(parseInt(e.target.value, 10), selectedDateKey);
                });
            }

            if (skyNowBtn) {
                skyNowBtn.addEventListener('click', () => {
                    isLive = true;
                    const now = new Date();
                    const mins = now.getHours() * 60 + now.getMinutes();
                    selectedDateKey = getDateKey(now);
                    if (dateInput) dateInput.value = selectedDateKey;
                    if (skySlider) skySlider.value = mins;
                    update(mins, selectedDateKey);
                });
            }

            const stealthTrigger = document.getElementById('stealth-trigger');
            if (stealthTrigger) {
                stealthTrigger.addEventListener('click', toggleStealthMode);
            }

            window.addEventListener('resize', () => {
                try {
                    drawSeasonalTrajectories();
                    if (skySlider) update(parseInt(skySlider.value, 10), selectedDateKey);
                } catch (e) {
                    console.error('Resize error:', e);
                }
            });

            // === INIT ===
            function init() {
                try {
                    const savedLocation = readSavedLocation();
                    if (savedLocation) {
                        LAT = savedLocation.lat;
                        LNG = savedLocation.lng;
                        locationSource = savedLocation.source;
                        if (citySearch) citySearch.value = savedLocation.city;
                    } else if (citySearch) {
                        citySearch.value = 'Warszawa';
                    }

                    selectedDateKey = getDateKey(new Date());
                    if (dateInput) dateInput.value = selectedDateKey;

                    if (stealthMode) {
                        document.body.classList.add('stealth-mode');
                        const icon = document.getElementById('stealth-icon-panel');
                        if (icon) {
                            icon.setAttribute('data-lucide', 'eye-off');
                            icon.style.color = '#ff6b6b';
                        }
                    }

                    const now = new Date();
                    const mins = now.getHours() * 60 + now.getMinutes();
                    if (skySlider) skySlider.value = mins;

                    update(mins, selectedDateKey);

                    if (!initialized) {
                        initialized = true;
                        setInterval(() => {
                            if (isLive) {
                                const now = new Date();
                                const currentMins = now.getHours() * 60 + now.getMinutes();
                                selectedDateKey = getDateKey(now);
                                if (dateInput) dateInput.value = selectedDateKey;
                                if (skySlider) skySlider.value = currentMins;
                                update(currentMins, selectedDateKey);
                            }
                        }, 60000);

                        if (window.lucide) lucide.createIcons();
                        initSeasonToggles();
                    }
                } catch (e) {
                    console.error('SunTrack init error:', e);
                }
            }

            // === BOOTSTRAP ===
            window.addEventListener('load', () => {
                setTimeout(() => {
                    const savedLocation = readSavedLocation();
                    const hasManualLocation = savedLocation && savedLocation.source === 'manual';
                    if (hasManualLocation || !navigator.geolocation) init();
                    else requestCurrentLocation(false);
                }, 100);
            });

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./service-worker.js', { scope: './' })
                        .catch(error => console.warn('SunTrack service worker unavailable:', error));
                }, { once: true });
            }
        </script>
</body>

</html>
