<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Atmosphere | DraftLab.pl</title>

    <meta name="theme-color" content="#0f1012">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Meta Tags SEO -->
    <meta name="description"
        content="Monitoring parametrów powietrza HomePod mini i wizualizacja danych klimatycznych.">
    <meta property="og:title" content="Atmosphere | DraftLab.pl">
    <meta property="og:description" content="Dashboard klimatyczny HomePod mini.">

    <!-- Fonts & Icons -->
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="../src/style.css">
    <script type="module" src="../src/main.js"></script>
</head>

<body class="bg-tech-bg text-white font-sans bg-grid-pattern selection:bg-tech-green selection:text-black">

    <dl-header></dl-header>
    <div class="scanline"></div>

    <div class="dl-dashboard">
        <!-- App Hero -->
        <div class="dl-app-hero mt-6" data-reveal>
            <div class="dl-app-icon"><i data-lucide="cloud" class="w-6 h-6"></i></div>
            <div class="min-w-0">
                <h1 class="text-2xl md:text-3xl font-bold tracking-tighter uppercase leading-none font-mono">
                    Atmosphere</h1>
                <p class="text-tech-dim text-[10px] uppercase tracking-[0.2em] mt-1.5 font-mono">/
                    Climate_Monitoring_System</p>
            </div>
            <div class="ml-auto flex items-center gap-3">
                <span class="dl-app-badge"><span
                        class="w-1.5 h-1.5 rounded-full bg-tech-green animate-pulse"></span>v0.2</span>
                <a href="AtmosphereAnalytics.html" class="dl-app-action">
                    <i data-lucide="bar-chart-3" width="14"></i>
                    <span class="hidden sm:inline">ANALYTICS</span>
                </a>
            </div>
        </div>

        <!-- Date Control -->
        <div class="dl-stat-card flex-row justify-between items-center !p-3 !mb-5">
            <button id="prev-date" class="dl-control-btn"><i data-lucide="chevron-left" width="20"></i></button>
            <div id="selected-date" class="font-mono text-sm font-bold text-white">
                DZISIAJ</div>
            <button id="next-date" class="dl-control-btn" disabled><i data-lucide="chevron-right"
                    width="20"></i></button>
        </div>


        <div class="dl-section-label" data-i18n="atmo.live">LIVE STATUS</div>

        <!-- Live Stats Row -->
        <div class="dl-stats-grid mb-5">
            <div class="dl-stat-card">
                <div class="dl-stat-label">
                    <span data-i18n="atmo.temp">TEMP</span>
                    <i data-lucide="thermometer" width="12"></i>
                </div>
                <div class="dl-stat-value" id="current-temp">--<span class="dl-stat-unit">°C</span></div>
            </div>
            <div class="dl-stat-card">
                <div class="dl-stat-label">
                    <span data-i18n="atmo.humidity">WILGOTNOŚĆ</span>
                    <i data-lucide="droplets" width="12"></i>
                </div>
                <div class="dl-stat-value" id="current-humidity">--<span class="dl-stat-unit">%</span></div>
            </div>
        </div>

        <!-- Chart Area -->
        <div class="dl-chart-container">
            <div class="dl-chart-header">
                <div class="dl-chart-title" data-i18n="atmo.chart.24h">Wykres 24H</div>
                <div class="dl-chart-title !text-tech-green/60 font-mono" id="last-update">--:--</div>
            </div>
            <div class="dl-chart-wrapper">
                <div class="dl-loading-overlay active" id="chart-loader">
                    <div class="dl-loader"></div>
                </div>
                <canvas id="atmosphereChart"></canvas>
            </div>
        </div>

        <div class="dl-section-label mt-5" data-i18n="atmo.analytics.day">ANALYTICS (DOBA)</div>

        <!-- Analytics Row -->
        <div class="dl-stats-grid mb-5">
            <div class="dl-stat-card">
                <div class="dl-stat-label">
                    <span data-i18n="atmo.minmax">MIN / MAX</span>
                    <i data-lucide="bar-chart-2" width="12"></i>
                </div>
                <div class="dl-stat-value !text-lg">
                    <span id="day-min">--</span> / <span id="day-max">--</span><span class="dl-stat-unit">°C</span>
                </div>
            </div>
            <div class="dl-stat-card">
                <div class="dl-stat-label">
                    <span data-i18n="atmo.avg_hum">ŚREDNIA / WILG.</span>
                    <i data-lucide="activity" width="12"></i>
                </div>
                <div class="dl-stat-value !text-lg">
                    <span id="day-avg">--</span><span class="dl-stat-unit">°C</span> <span
                        class="text-xs text-white/30">|</span> <span id="day-hum-avg">--</span><span
                        class="dl-stat-unit">%</span>
                </div>
            </div>
        </div>

        <div class="dl-section-label mt-5" data-i18n="atmo.periods">PORY DNIA</div>

        <!-- Time of Day Stats -->
        <div class="dl-stats-grid mb-5 !grid-cols-4">
            <div class="dl-stat-card !p-2">
                <div class="dl-stat-label !text-[9px]">
                    <span data-i18n="atmo.period.morning">RANO</span>
                    <i data-lucide="sunrise" width="10"></i>
                </div>
                <div class="dl-stat-value !text-sm" id="time-morning">--<span class="dl-stat-unit">°C</span>
                </div>
            </div>
            <div class="dl-stat-card !p-2">
                <div class="dl-stat-label !text-[9px]">
                    <span data-i18n="atmo.period.noon">POŁUDNIE</span>
                    <i data-lucide="sun" width="10"></i>
                </div>
                <div class="dl-stat-value !text-sm" id="time-noon">--<span class="dl-stat-unit">°C</span>
                </div>
            </div>
            <div class="dl-stat-card !p-2">
                <div class="dl-stat-label !text-[9px]">
                    <span data-i18n="atmo.period.evening">WIECZÓR</span>
                    <i data-lucide="sunset" width="10"></i>
                </div>
                <div class="dl-stat-value !text-sm" id="time-evening">--<span class="dl-stat-unit">°C</span>
                </div>
            </div>
            <div class="dl-stat-card !p-2">
                <div class="dl-stat-label !text-[9px]">
                    <span data-i18n="atmo.period.night">NOC</span>
                    <i data-lucide="moon" width="10"></i>
                </div>
                <div class="dl-stat-value !text-sm" id="time-night">--<span class="dl-stat-unit">°C</span>
                </div>
            </div>
        </div>

        <div class="text-center text-[10px] text-white/20 font-mono py-5 pb-[calc(20px+env(safe-area-inset-bottom))]">
            DATA SOURCE: HOMEPOD MINI • SHORTCUTS API
        </div>
    </div>

    <!-- Application Logic -->
    <script type="module">
        import { init as initNucleus } from '../src/core/Nucleus.js';
        import { init as initAtmosphere } from '../src/apps/Atmosphere.js';
        import { i18n } from '../src/utils/i18n.js';

        initNucleus();
        initAtmosphere();

        // Init i18n static
        i18n.updateStaticElements();
        // Subscribe handled in Atmosphere.js mostly, but here we can add it too for safety if strictly static
        i18n.subscribe(() => i18n.updateStaticElements());

        lucide.createIcons();
    </script>
</body>

</html>
