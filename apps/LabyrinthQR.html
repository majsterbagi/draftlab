<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabyrinthQR | DraftLab</title>
    <link rel="stylesheet" href="../src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="../src/main.js"></script>
</head>

<body
    class="font-mono bg-tech-bg bg-grid-pattern min-h-screen flex flex-col relative overflow-x-hidden selection:bg-tech-green selection:text-black">

    <div class="scanline"></div>

    <dl-header></dl-header>

    <main class="flex-grow w-full max-w-7xl mx-auto px-4 pt-12 pb-8 mt-12">

        <!-- Header Section -->
        <div class="mb-8 border-b border-tech-gray border-dashed pb-4 flex items-end justify-between">
            <div>
                <h1 class="text-3xl font-bold text-white flex items-center gap-3">
                    <i data-lucide="qr-code" class="text-tech-green"></i>
                    LabyrinthQR
                </h1>
                <p class="text-tech-dim mt-1 text-sm max-w-lg">
                    Twórz bezpieczne i estetyczne kody QR. Generator działa lokalnie (Client-Side).
                    Obsługa linków, <span class="whitespace-nowrap">Wi-Fi</span>, wizytówek oraz <span
                        class="text-tech-green">wiadomości w chmurze</span>.
                </p>
            </div>
            <div class="hidden md:block">
                <span
                    class="px-2 py-1 border border-tech-green text-tech-green text-xs rounded bg-tech-green/10">v1.0.0</span>
            </div>
        </div>

        <!-- Main Workspace -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start relative">

            <!-- LEFT PANEL: Controls (4 cols) -->
            <div class="lg:col-span-4 space-y-6">

                <!-- 1. Content Type -->
                <div class="bg-black/40 border border-tech-gray p-4 backdrop-blur-sm relative group">
                    <div
                        class="absolute -top-1 -left-1 w-2 h-2 border-t border-l border-tech-dim group-hover:border-tech-green transition-colors">
                    </div>
                    <div
                        class="absolute -bottom-1 -right-1 w-2 h-2 border-b border-r border-tech-dim group-hover:border-tech-green transition-colors">
                    </div>

                    <h2 class="text-white text-sm font-bold mb-4 uppercase flex items-center gap-2">
                        <i data-lucide="database" class="w-4 h-4 text-tech-green"></i> <span data-i18n="qr.sect.1">1.
                            Dane Wejściowe</span>
                    </h2>

                    <!-- Type Selector -->
                    <button
                        class="px-3 py-1 text-xs text-tech-green bg-tech-green/20 border border-tech-green rounded transition-all whitespace-nowrap"
                        id="type-text" data-i18n="qr.type.text">Tekst</button>
                    <button class="px-3 py-1 text-xs text-tech-dim hover:text-white transition-all whitespace-nowrap"
                        id="type-page" data-i18n="qr.type.msg">Zostaw Wiadomość</button>
                    <button class="px-3 py-1 text-xs text-tech-dim hover:text-white transition-all whitespace-nowrap"
                        id="type-url" data-i18n="qr.type.url">Link / URL</button>
                    <button class="px-3 py-1 text-xs text-tech-dim hover:text-white transition-all whitespace-nowrap"
                        id="type-wifi" data-i18n="qr.type.wifi">Wi-Fi</button>
                    <button class="px-3 py-1 text-xs text-tech-dim hover:text-white transition-all whitespace-nowrap"
                        id="type-card" data-i18n="qr.type.card">vCard</button>
                </div>

                <!-- Input Fields (Dynamic) -->
                <div id="input-container" class="space-y-3">
                    <!-- URL Input (Default) -->
                    <div class="input-group" data-type="url">
                        <label class="block text-xs text-tech-dim mb-1" data-i18n="qr.type.url">Adres URL</label>
                        <input type="text" id="inp-url"
                            class="w-full bg-black border border-tech-gray text-white text-sm p-2 focus:border-tech-green focus:outline-none transition-colors placeholder-white/20"
                            placeholder="https://draftlab.pl" value="https://draftlab.pl">
                    </div>
                </div>


                <!-- 2. Appearance -->
                <div class="bg-black/40 border border-tech-gray p-4 backdrop-blur-sm relative group">
                    <h2 class="text-white text-sm font-bold mb-4 uppercase flex items-center gap-2">
                        <i data-lucide="palette" class="w-4 h-4 text-tech-green"></i> <span data-i18n="qr.sect.2">2.
                            Stylizacja</span>
                    </h2>

                    <!-- Dots Style -->
                    <div class="mb-4">
                        <label class="block text-xs text-tech-dim mb-2" data-i18n="qr.shape">Kształt Modułów</label>
                        <div class="grid grid-cols-4 gap-2">
                            <button
                                class="style-btn active border border-tech-green bg-tech-green/20 text-white text-xs py-2 hover:bg-tech-green/30"
                                data-dots="square">Square</button>
                            <button
                                class="style-btn border border-tech-gray text-tech-dim text-xs py-2 hover:border-white hover:text-white"
                                data-dots="dots">Dots</button>
                            <button
                                class="style-btn border border-tech-gray text-tech-dim text-xs py-2 hover:border-white hover:text-white"
                                data-dots="rounded">Round</button>
                            <button
                                class="style-btn border border-tech-gray text-tech-dim text-xs py-2 hover:border-white hover:text-white"
                                data-dots="classy">Classy</button>
                        </div>
                    </div>

                    <!-- Colors -->
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-xs text-tech-dim mb-1" data-i18n="qr.color.main">Kolor
                                Główny</label>
                            <div class="flex items-center gap-2">
                                <div
                                    class="h-8 w-8 rounded overflow-hidden border-2 border-white/20 hover:border-tech-green transition-colors relative">
                                    <input type="color" id="color-primary" value="#00ff41"
                                        class="absolute -top-1/2 -left-1/2 w-[200%] h-[200%] p-0 m-0 border-0 cursor-pointer">
                                </div>
                                <span class="text-xs text-tech-dim font-mono" id="hex-primary">#00ff41</span>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs text-tech-dim mb-1" data-i18n="qr.color.bg">Kolor Tła</label>
                            <div class="flex items-center gap-2">
                                <div
                                    class="h-8 w-8 rounded overflow-hidden border-2 border-white/20 hover:border-tech-green transition-colors relative">
                                    <input type="color" id="color-bg" value="#000000"
                                        class="absolute -top-1/2 -left-1/2 w-[200%] h-[200%] p-0 m-0 border-0 cursor-pointer">
                                </div>
                                <span class="text-xs text-tech-dim font-mono" id="hex-bg">#000000</span>
                            </div>
                        </div>
                    </div>

                    <!-- Logo Upload -->
                    <div class="pt-4 border-t border-tech-gray border-dashed mb-4">
                        <label class="block text-xs text-tech-dim mb-2 flex justify-between">
                            <span data-i18n="qr.logo">Logo (Środek)</span>
                            <span class="text-xs text-tech-green cursor-pointer hover:underline" id="clear-logo"
                                data-i18n="qr.logo.remove">Usuń</span>
                        </label>
                        <label
                            class="flex items-center justify-center w-full h-10 border border-tech-gray border-dashed hover:border-tech-green hover:bg-tech-green/5 cursor-pointer transition-all">
                            <span class="text-xs text-tech-dim" data-i18n="qr.logo.select">Wybierz plik...</span>
                            <input type="file" id="inp-logo" accept="image/*" class="hidden">
                        </label>
                    </div>

                    <!-- Size Slider -->
                    <div class="pt-4 border-t border-tech-gray border-dashed">
                        <label class="block text-xs text-tech-dim mb-2 flex justify-between">
                            <span data-i18n="qr.size">Rozmiar</span>
                            <span class="text-xs text-tech-green font-mono" id="size-val">250px</span>
                        </label>
                        <input type="range" id="inp-size" min="50" max="2000" step="50" value="250"
                            class="w-full accent-tech-green cursor-pointer">
                    </div>
                </div>

                <!-- 3. Export -->
                <div class="bg-black/40 border border-tech-gray p-4 backdrop-blur-sm">
                    <div class="grid grid-cols-2 gap-3">
                        <button id="btn-download"
                            class="bg-tech-green text-black font-bold py-3 uppercase tracking-wider hover:bg-white transition-colors flex items-center justify-center gap-2">
                            <i data-lucide="download" class="w-4 h-4"></i> PNG
                        </button>
                        <button id="btn-print"
                            class="bg-transparent border border-tech-green text-tech-green font-bold py-3 uppercase tracking-wider hover:bg-tech-green hover:text-black transition-colors flex items-center justify-center gap-2">
                            <i data-lucide="printer" class="w-4 h-4"></i> <span data-i18n="qr.btn.print">Drukuj</span>
                        </button>
                    </div>
                </div>

            </div>

            <!-- RIGHT PANEL: Preview (8 cols) -->
            <div
                class="lg:col-span-8 flex flex-col items-center justify-center min-h-[500px] border border-tech-gray bg-black/50 backdrop-blur-md relative overflow-hidden group">

                <!-- Decorators -->
                <div class="absolute top-0 left-0 p-4 border-b border-r border-tech-gray/50">
                    <div class="text-[10px] text-tech-dim font-mono">CANVAS_RENDERER</div>
                </div>
                <div class="absolute bottom-4 right-4 text-[10px] text-tech-dim font-mono animate-pulse">
                    STATUS: READY
                </div>

                <!-- Grid Background -->
                <div
                    class="absolute inset-0 bg-[linear-gradient(rgba(0,255,65,0.03)_1px,transparent_1px),linear-gradient(90deg,rgba(0,255,65,0.03)_1px,transparent_1px)] bg-[size:20px_20px] pointer-events-none">
                </div>

                <!-- QR Container -->
                <div id="qr-canvas"
                    class="relative z-10 p-8 border border-dashed border-tech-green/30 bg-black shadow-[0_0_50px_rgba(0,255,65,0.1)] transition-all duration-500">
                    <!-- QR WILL BE INJECTED HERE -->
                </div>

            </div>

        </div>

    </main>

    <dl-footer></dl-footer>

    <!-- External Lib: qr-code-styling from CDN -->
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <script type="module">
        import { init as initNucleus } from '../src/core/Nucleus.js';
        import { i18n } from '../src/utils/i18n.js';

        initNucleus();

        // Init i18n static elements
        i18n.updateStaticElements();

        // Note: Dynamic inputs in logic.js will be handled by logic.js subscribing to i18n
    </script>
    <script type="module" src="../src/apps/labyrinth_qr/logic.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
