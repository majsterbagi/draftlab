<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Log | DraftLab</title>
    <link rel="stylesheet" href="../src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body
    class="bg-tech-bg bg-grid-pattern min-h-screen flex flex-col pt-20 pb-12 px-4 selection:bg-tech-green selection:text-black">

    <div
        class="fixed top-0 left-0 w-full h-1 bg-gradient-to-r from-tech-green via-transparent to-transparent opacity-50">
    </div>

    <div class="w-full max-w-4xl mx-auto">
        <!-- Header -->
        <header
            class="border-b border-tech-gray pb-8 mb-12 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            <div>
                <a href="../index.html"
                    class="inline-flex items-center gap-2 text-tech-dim text-xs mb-4 hover:text-white transition-colors uppercase tracking-widest">
                    <i data-lucide="arrow-left" width="14"></i>
                    Powrót do bazy
                </a>
                <h1 class="text-3xl md:text-5xl font-bold text-white tracking-tight mb-2 flex items-center gap-4">
                    <i data-lucide="terminal" class="text-tech-green"></i>
                    SYSTEM LOG
                </h1>
                <p class="text-tech-dim text-sm font-mono">
                    // PEŁNY REJESTR ZMIAN I KOMITÓW
                </p>
            </div>

            <div class="flex flex-col items-end">
                <div class="text-right">
                    <div class="text-xs text-tech-dim uppercase tracking-widest mb-1">Status Systemu</div>
                    <div class="flex items-center gap-2 text-tech-green font-bold text-sm">
                        <span class="relative flex h-2 w-2">
                            <span
                                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-tech-green opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-tech-green"></span>
                        </span>
                        OPERATIONAL
                    </div>
                </div>
            </div>
        </header>

        <!-- Stats / Filter Placeholder -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12">
            <div class="bg-[#0f0f0f] border border-tech-gray p-4 flex flex-col justify-between h-24">
                <span class="text-[10px] text-tech-dim uppercase tracking-widest">Total Commits</span>
                <span class="text-2xl text-white font-mono" id="stat-total">--</span>
            </div>
            <div class="bg-[#0f0f0f] border border-tech-gray p-4 flex flex-col justify-between h-24">
                <span class="text-[10px] text-tech-dim uppercase tracking-widest">Last Update</span>
                <span class="text-sm text-white font-mono" id="stat-last">--</span>
            </div>
            <div
                class="bg-[#0f0f0f] border border-tech-gray p-4 flex flex-col justify-between h-24 col-span-2 md:col-span-2 relative overflow-hidden group">
                <span class="text-[10px] text-tech-dim uppercase tracking-widest z-10 relative">Repository</span>
                <div class="text-lg text-white font-mono z-10 relative mt-auto flex items-center gap-2">
                    <i data-lucide="git-branch" width="16" class="text-tech-green"></i>
                    main / origin
                </div>
                <i data-lucide="github"
                    class="absolute -right-2 -bottom-2 text-tech-gray/10 group-hover:text-tech-gray/20 transition-colors"
                    width="80" height="80"></i>
            </div>
        </div>

        <!-- Timeline -->
        <main class="relative border-l border-tech-gray ml-4 md:ml-8 space-y-0" id="log-container">
            <!-- Items will be injected here -->
        </main>

        <footer class="mt-20 pt-8 border-t border-tech-gray border-dashed text-center">
            <p class="text-tech-dim text-xs uppercase tracking-widest">
                End of Log Stream
            </p>
        </footer>
    </div>

    <!-- Detail Modal -->
    <dialog id="detail-modal"
        class="bg-transparent p-0 w-full max-w-2xl backdrop:bg-black/80 backdrop:backdrop-blur-sm open:animate-in open:fade-in open:zoom-in-95 closed:animate-out closed:fade-out closed:zoom-out-95">
        <div class="bg-[#0f0f0f] border border-tech-gray shadow-2xl relative overflow-hidden">
            <!-- Header -->
            <div class="border-b border-tech-gray/50 p-6 flex justify-between items-start bg-white/5">
                <div>
                    <div class="flex items-center gap-3 mb-2">
                        <span id="modal-type" class="text-xs font-bold px-2 py-1 rounded border">TYPE</span>
                        <span id="modal-component" class="text-white font-bold text-sm tracking-wide">COMPONENT</span>
                    </div>
                    <div class="font-mono text-xs text-tech-dim flex gap-4">
                        <span id="modal-date">DATE</span>
                        <span id="modal-hash">HASH</span>
                    </div>
                </div>
                <button onclick="document.getElementById('detail-modal').close()"
                    class="text-tech-dim hover:text-white transition-colors">
                    <i data-lucide="x" width="24"></i>
                </button>
            </div>

            <!-- Body -->
            <div class="p-8">
                <h3 class="text-lg text-white font-bold mb-4">Opis zmiany</h3>
                <p id="modal-desc" class="text-tech-dim text-sm leading-relaxed mb-8 border-l-2 border-tech-green pl-4">
                    Short description...
                </p>

                <h3 class="text-tech-green font-bold text-xs uppercase tracking-widest mb-3 flex items-center gap-2">
                    <i data-lucide="code-2" width="14"></i>
                    Szczegóły Techniczne
                </h3>
                <div
                    class="bg-black/30 border border-tech-gray/30 p-4 rounded font-mono text-xs text-tech-dim/80 leading-relaxed overflow-x-auto">
                    <p id="modal-details">
                        No technical details available.
                    </p>
                </div>
            </div>

            <!-- Footer -->
            <div class="bg-white/5 p-4 flex justify-end">
                <button onclick="document.getElementById('detail-modal').close()"
                    class="text-xs font-bold text-white uppercase tracking-widest hover:text-tech-green transition-colors px-4 py-2 border border-tech-gray hover:border-tech-green">
                    Zamknij
                </button>
            </div>
        </div>
    </dialog>

    <script type="module">
        import { GIT_LOG_DATA } from '../src/data/git_log_data.js';

        const container = document.getElementById('log-container');
        const statTotal = document.getElementById('stat-total');
        const statLast = document.getElementById('stat-last');
        const modal = document.getElementById('detail-modal');

        // Modal Elements
        const mType = document.getElementById('modal-type');
        const mComponent = document.getElementById('modal-component');
        const mDate = document.getElementById('modal-date');
        const mHash = document.getElementById('modal-hash');
        const mDesc = document.getElementById('modal-desc');
        const mDetails = document.getElementById('modal-details');

        window.openLogDetail = (index) => {
            const log = GIT_LOG_DATA[index];
            if (!log) return;

            mComponent.innerText = (log.component || 'SYS').toUpperCase();
            mDate.innerText = log.date;
            mHash.innerText = '#' + log.hash;
            mDesc.innerText = log.desc;
            mDetails.innerText = log.details || "Brak dodatkowych szczegółów technicznych dla tej zmiany.";

            // Reset classes
            mType.className = 'text-xs font-bold px-2 py-1 rounded border';

            let typeColor = 'text-tech-dim bg-tech-dim/10 border-tech-dim/20';
            let typeName = log.type;

            if (log.type === 'FEAT' || log.type === 'FEATURE') {
                typeColor = 'text-tech-green bg-tech-green/10 border-tech-green/20';
            }
            if (log.type === 'FIX' || log.type === 'HOTFIX') {
                typeColor = 'text-blue-400 bg-blue-400/10 border-blue-400/20';
            }
            if (log.type === 'STYLE') {
                typeColor = 'text-purple-400 bg-purple-400/10 border-purple-400/20';
            }
            if (log.type === 'REVERT') {
                typeColor = 'text-red-400 bg-red-400/10 border-red-400/20';
            }

            mType.classList.add(...typeColor.split(' '));
            mType.innerText = typeName;

            modal.showModal();
            // Re-render icons inside modal if needed, though they are static x and code-2
            if (window.lucide) window.lucide.createIcons();
        };

        // Stats
        statTotal.innerText = GIT_LOG_DATA.length;
        if (GIT_LOG_DATA.length > 0) {
            statLast.innerText = GIT_LOG_DATA[0].date;
        }

        // Render
        const html = GIT_LOG_DATA.map((log, index) => {
            let typeColor = 'text-tech-dim bg-tech-dim/10 border-tech-dim/20';
            let icon = 'circle';

            if (log.type === 'FEAT' || log.type === 'FEATURE') {
                typeColor = 'text-tech-green bg-tech-green/10 border-tech-green/20';
                icon = 'plus';
            }
            if (log.type === 'FIX' || log.type === 'HOTFIX') {
                typeColor = 'text-blue-400 bg-blue-400/10 border-blue-400/20';
                icon = 'wrench';
            }
            if (log.type === 'STYLE') {
                typeColor = 'text-purple-400 bg-purple-400/10 border-purple-400/20';
                icon = 'palette';
            }
            if (log.type === 'REVERT') {
                typeColor = 'text-red-400 bg-red-400/10 border-red-400/20';
                icon = 'rotate-ccw';
            }

            return `
            <div onclick="window.openLogDetail(${index})" class="relative pl-8 md:pl-12 py-6 group hover:bg-white/[0.02] transition-colors pr-4 rounded-r-xl border-b border-tech-gray/30 last:border-0 cursor-pointer">
                <!-- Dot on timeline -->
                <div class="absolute -left-[5px] top-8 w-2.5 h-2.5 rounded-full bg-[#0f0f0f] border border-tech-gray group-hover:border-tech-green group-hover:scale-125 transition-all z-10"></div>
                
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-3">
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-bold px-2 py-1 rounded border ${typeColor}">${log.type}</span>
                        <span class="text-white font-bold text-sm tracking-wide">${(log.component || 'SYS').toUpperCase()}</span>
                    </div>
                    
                    <div class="flex items-center gap-4 text-xs font-mono text-tech-dim">
                        <span class="flex items-center gap-1.5">
                            <i data-lucide="calendar" width="12"></i>
                            ${log.date}
                        </span>
                        <span class="flex items-center gap-1.5 px-2 py-0.5 bg-white/5 rounded text-tech-dim/70">
                            <i data-lucide="hash" width="10"></i>
                            ${log.hash}
                        </span>
                    </div>
                </div>
                
                <p class="text-tech-dim/90 text-sm leading-relaxed max-w-3xl group-hover:text-white transition-colors">
                    ${log.desc}
                </p>
                
                <div class="mt-3 opacity-0 group-hover:opacity-100 transition-opacity text-[10px] text-tech-green uppercase tracking-widest flex items-center gap-1">
                    Zobacz szczegóły <i data-lucide="arrow-right" width="10"></i>
                </div>
            </div>
            `;
        }).join('');

        container.innerHTML = html;
        lucide.createIcons();
    </script>
</body>

</html>
