<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Manifest | DraftLab</title>
    <link rel="stylesheet" href="../src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>


</head>

<body class="bg-tech-bg bg-grid-pattern min-h-screen flex flex-col items-center pt-20 pb-12 px-4">

    <div class="w-full max-w-3xl">
        <!-- Header handled by Nucleus.js -->

        <header class="border-b border-tech-gray pb-8 mb-10">
            <div class="flex items-start justify-between mb-4">
                <h1 class="text-3xl md:text-5xl font-bold text-white tracking-tight mb-2" id="p-title">...</h1>
                <span id="p-ver"
                    class="px-2 py-1 border border-tech-green text-tech-green text-xs font-bold rounded bg-tech-green/5">...</span>
            </div>
            <p id="p-about" class="text-tech-dim text-sm md:text-base leading-relaxed max-w-2xl">...</p>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-3 gap-12 mb-16">

            <div class="md:col-span-2 space-y-12">

                <section>
                    <h3 class="text-white font-bold mb-6 flex items-center gap-2 text-sm uppercase tracking-widest">
                        <i data-lucide="cpu" class="text-tech-green" width="16"></i> Główne Funkcje
                    </h3>
                    <div id="p-features" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                </section>

                <!-- Prototypes Section (only for SunTrack) -->
                <section id="prototypes-section" class="hidden">
                    <h3
                        class="text-white font-bold mb-6 flex items-center gap-2 text-sm uppercase tracking-widest border-t border-tech-gray pt-8">
                        <i data-lucide="archive" class="text-tech-green" width="16"></i> Archiwum Prototypów
                    </h3>
                    <div id="p-prototypes" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    </div>
                </section>

                <section>
                    <h3
                        class="text-white font-bold mb-6 flex items-center gap-2 text-sm uppercase tracking-widest border-t border-tech-gray pt-8">
                        <i data-lucide="history" class="text-tech-green" width="16"></i> Dziennik Zmian
                    </h3>
                    <div id="p-changelog" class="space-y-0 pl-2">
                    </div>
                </section>
            </div>

            <div class="space-y-10">

                <div class="bg-[#0f0f0f] border border-tech-gray p-6">
                    <h3 class="text-tech-dim text-xs font-bold mb-4 uppercase tracking-widest">/ Tech Stack</h3>
                    <div id="p-stack" class="flex flex-wrap gap-2">
                    </div>
                </div>

                <div>
                    <h3 class="text-tech-dim text-xs font-bold mb-4 uppercase tracking-widest flex items-center gap-2">
                        / Roadmap <span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span>
                    </h3>
                    <ul id="p-roadmap" class="space-y-3 text-sm text-tech-dim">
                    </ul>
                </div>

                <div class="text-[10px] text-tech-dim/50 font-mono border-t border-tech-gray/30 pt-4 mt-8">
                    DEV: KAMIL & AI<br>
                    LAST_SYNC: DEC 2025
                </div>

            </div>
        </main>
    </div>

    <script type="module">
        import { init } from '../src/core/Nucleus.js';
        init();
    </script>
    <script type="module">
        import { SITE_DATA } from '../src/data/db.js';

        const params = new URLSearchParams(window.location.search);
        const projectId = params.get('id');
        const project = SITE_DATA.projects.find(p => p.id === projectId);

        if (project) {
            // 1. Header
            const iconHtml = project.icon ? `<i data-lucide="${project.icon}" class="text-tech-green mr-3 md:mr-5 inline-block align-middle mb-1" style="width: 0.9em; height: 0.9em;"></i>` : '';
            document.getElementById('p-title').innerHTML = `${iconHtml}${project.title}`;
            document.getElementById('p-ver').innerText = project.version;
            document.getElementById('p-about').innerText = project.details?.about || project.desc;

            // 1b. SEO Injection
            document.title = `${project.title} - Changelog | DraftLab.pl`;

            // Meta Description
            let metaDesc = document.querySelector('meta[name="description"]');
            if (!metaDesc) {
                metaDesc = document.createElement('meta');
                metaDesc.name = "description";
                document.getElementsByTagName('head')[0].appendChild(metaDesc);
            }
            metaDesc.content = `Changelog i szczegóły projektu ${project.title}. ${project.desc}`;

            // Open Graph
            const ogTags = {
                'og:title': `${project.title} | DraftLab`,
                'og:description': project.desc,
                'og:url': window.location.href
            };

            for (const [property, content] of Object.entries(ogTags)) {
                let tag = document.querySelector(`meta[property="${property}"]`);
                if (!tag) {
                    tag = document.createElement('meta');
                    tag.setAttribute('property', property);
                    document.getElementsByTagName('head')[0].appendChild(tag);
                }
                tag.content = content;
            }

            // 2. Features
            const featuresEl = document.getElementById('p-features');
            if (project.details?.features) {
                featuresEl.innerHTML = project.details.features.map(f => `
                    <div class="bg-[#0f0f0f]/50 border border-tech-gray/50 p-4 hover:border-tech-green/30 transition-colors group">
                        <h4 class="text-white text-xs font-bold mb-1 group-hover:text-tech-green">${f.title}</h4>
                        <p class="text-tech-dim text-xs leading-relaxed">${f.desc}</p>
                    </div>
                `).join('');
            } else {
                featuresEl.innerHTML = `<div class="text-tech-dim text-xs">Brak danych o funkcjach.</div>`;
            }

            // 2b. Prototypes (only for SunTrack)
            if (projectId === 'suntrack') {
                const prototypesSection = document.getElementById('prototypes-section');
                const prototypesEl = document.getElementById('p-prototypes');

                const prototypes = [
                    {
                        version: 'v2.0',
                        date: '2025-12-18',
                        desc: 'Dynamiczne krajobrazy (wieś, miasteczko, metropolia), nocne światła, proceduralnie generowane budynki.',
                        url: 'prototypes/suntrack-v2.html'
                    },
                    {
                        version: 'v1.0',
                        date: '2025-12-17',
                        desc: 'Pierwszy prototyp z glassmorphism UI, chmurami i ptakami.',
                        url: 'prototypes/suntrack-v1.html'
                    }
                ];

                prototypesSection.classList.remove('hidden');
                prototypesEl.innerHTML = prototypes.map(p => `
                    <a href="${p.url}" class="bg-[#0f0f0f]/50 border border-tech-gray/50 p-4 hover:border-yellow-500/50 transition-colors group block no-underline">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-yellow-400 text-xs font-bold">PROTOTYP ${p.version}</span>
                            <span class="text-[10px] text-tech-dim font-mono">${p.date}</span>
                        </div>
                        <p class="text-tech-dim text-xs leading-relaxed">${p.desc}</p>
                        <div class="mt-3 flex items-center gap-2 text-[10px] text-tech-green font-bold uppercase tracking-widest group-hover:underline">
                            <i data-lucide="play" width="10"></i> Uruchom Demo
                        </div>
                    </a>
                `).join('');
            }

            // 3. Tech Stack
            const stackEl = document.getElementById('p-stack');
            if (project.details?.techStack) {
                stackEl.innerHTML = project.details.techStack.map(t => `
                    <span class="text-[10px] border border-tech-gray text-tech-dim px-2 py-1 bg-black">${t}</span>
                `).join('');
            }

            // 4. Roadmap
            const roadmapEl = document.getElementById('p-roadmap');
            if (project.details?.roadmap) {
                roadmapEl.innerHTML = project.details.roadmap.map(item => `
                    <li class="flex items-start gap-3">
                        <div class="mt-0.5 w-3 h-3 border border-tech-gray flex items-center justify-center ${item.done ? 'bg-tech-green border-tech-green' : ''}">
                            ${item.done ? '<i data-lucide="check" class="text-black" width="8"></i>' : ''}
                        </div>
                        <span class="${item.done ? 'text-tech-dim line-through' : 'text-gray-300'}">${item.task}</span>
                    </li>
                `).join('');
            }

            // 5. Changelog with Pagination
            const logEl = document.getElementById('p-changelog');
            const ITEMS_PER_PAGE = 5;
            let currentPage = 1;

            const renderChangelog = () => {
                if (!project.changes || project.changes.length === 0) {
                    logEl.innerHTML = '<div class="text-tech-dim text-xs">Brak zmian.</div>';
                    return;
                }

                const totalPages = Math.ceil(project.changes.length / ITEMS_PER_PAGE);
                const start = (currentPage - 1) * ITEMS_PER_PAGE;
                const end = start + ITEMS_PER_PAGE;
                const pageItems = project.changes.slice(start, end);

                const listHtml = pageItems.map((change) => {
                    let colorClass = change.type === 'CORE' || change.type === 'INIT' ? 'text-blue-400' : (change.type === 'FEAT' ? 'text-tech-green' : 'text-tech-dim');

                    return `
                    <div class="timeline-item relative pl-6 pb-8 group">
                        <div class="timeline-line"></div>
                        <div class="absolute left-0 top-1.5 w-3 h-3 rounded-full bg-tech-bg border border-tech-gray group-hover:border-white transition-colors z-10"></div>
                        
                        <div class="flex items-baseline gap-3 mb-1">
                            <span class="text-white font-bold text-sm">${change.version}</span>
                            <span class="text-[10px] font-mono text-tech-dim">${change.date}</span>
                            <span class="text-[9px] font-bold border border-white/10 px-1 rounded ${colorClass}">${change.type}</span>
                        </div>
                        <p class="text-tech-dim text-xs leading-relaxed max-w-prose">
                            ${change.desc}
                        </p>
                        ${change.details ? `
                        <div class="mt-3 pt-3 border-t border-dashed border-tech-gray/30">
                            <span class="text-[9px] uppercase tracking-widest text-tech-dim/50 block mb-1">Szczegóły Techniczne:</span>
                            <div class="font-mono text-[10px] text-tech-dim/80 whitespace-pre-wrap">${change.details}</div>
                        </div>
                        ` : ''}
                    </div>
                    `;
                }).join('');

                // Pagination Controls (Only if needed)
                const paginationHtml = totalPages > 1 ? `
                    <div class="flex justify-between items-center mt-4 pt-6 border-t border-tech-gray border-dashed">
                        <button id="prev-page" class="flex items-center gap-2 px-3 py-2 text-[10px] font-bold uppercase tracking-widest text-tech-green border border-transparent hover:border-tech-green transition-all disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:border-transparent" ${currentPage === 1 ? 'disabled' : ''}>
                            <i data-lucide="arrow-left" width="14"></i> Nowsze
                        </button>
                        <span class="text-[10px] text-tech-dim font-mono">STRONA ${currentPage} / ${totalPages}</span>
                        <button id="next-page" class="flex items-center gap-2 px-3 py-2 text-[10px] font-bold uppercase tracking-widest text-tech-green border border-transparent hover:border-tech-green transition-all disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:border-transparent" ${currentPage === totalPages ? 'disabled' : ''}>
                            Starsze <i data-lucide="arrow-right" width="14"></i>
                        </button>
                    </div>
                ` : '';

                logEl.innerHTML = listHtml + paginationHtml;

                // Re-bind events
                if (totalPages > 1) {
                    document.getElementById('prev-page')?.addEventListener('click', () => {
                        if (currentPage > 1) { currentPage--; renderChangelog(); window.scrollTo({ top: document.getElementById('p-changelog').offsetTop - 100, behavior: 'smooth' }); }
                    });
                    document.getElementById('next-page')?.addEventListener('click', () => {
                        if (currentPage < totalPages) { currentPage++; renderChangelog(); window.scrollTo({ top: document.getElementById('p-changelog').offsetTop - 100, behavior: 'smooth' }); }
                    });
                }

                lucide.createIcons();
            };

            renderChangelog();
        } else {
            document.body.innerHTML = "<div class='text-white p-10'>PROJECT NOT FOUND</div>";
        }

        lucide.createIcons();
    </script>
</body>

</html>
