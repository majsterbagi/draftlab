<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- iOS PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SunTrack">

    <title>SunTrack Prototype v1 | DraftLab.pl</title>

    <!-- Import JetBrains Mono for consistency -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.8.0/suncalc.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-top: #0f2027;
            --bg-mid: #203a43;
            --bg-bottom: #2c5364;
            --glass-bg: rgba(20, 20, 25, 0.85);
            --text-primary: #ffffff;
            --sun-x: 50%;
            --sun-y: 60%;
        }

        body {
            margin: 0;
            /* Fix dla mobilnych pasków adresu: używamy dvh (dynamic viewport height) */
            height: 100vh;
            /* Fallback */
            height: 100dvh;
            padding-top: env(safe-area-inset-top);
            /* Padding bottom przeniesiony do ui-panel, żeby tło dochodziło do krawędzi */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, var(--bg-top), var(--bg-mid), var(--bg-bottom));
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: var(--text-primary);
            overscroll-behavior: none;
        }

        /* --- DRAFTLAB HEADER OVERLAY --- */
        .draftlab-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            padding-top: max(15px, env(safe-area-inset-top));
            /* Bezpieczny margines góra */
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), transparent);
            pointer-events: none;
            box-sizing: border-box;
        }

        .draftlab-logo {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .back-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            pointer-events: auto;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            border-color: #00ff9d;
        }

        /* Prototype Badge */
        .prototype-badge {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 107, 107, 0.9);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 20px;
            z-index: 1000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- SKY CONTAINER --- */
        .sky-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        /* GWIAZDY */
        .stars-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease;
            z-index: 1;
        }

        .stars {
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0, 0, 0, 0)),
                radial-gradient(1.5px 1.5px at 150px 70px, #fff, rgba(0, 0, 0, 0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0, 0, 0, 0)),
                radial-gradient(1.5px 1.5px at 200px 40px, #fff, rgba(0, 0, 0, 0)),
                radial-gradient(2px 2px at 300px 120px, #fff, rgba(0, 0, 0, 0));
            background-repeat: repeat;
            background-size: 350px 350px;
            animation: twinkle 4s infinite ease-in-out;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.9;
            }

            50% {
                opacity: 0.6;
            }
        }

        /* WARSTWA DZIENNA */
        .day-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 2s ease;
            z-index: 2;
        }

        .cloud {
            position: absolute;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            filter: blur(20px);
            opacity: 0.6;
        }

        .c1 {
            width: 160px;
            height: 60px;
            top: 15%;
            left: -20%;
            animation: float 45s linear infinite;
        }

        .c2 {
            width: 200px;
            height: 80px;
            top: 5%;
            left: -20%;
            animation: float 60s linear infinite 5s;
            opacity: 0.4;
        }

        .c3 {
            width: 120px;
            height: 40px;
            top: 25%;
            left: -20%;
            animation: float 35s linear infinite 12s;
        }

        @keyframes float {
            0% {
                transform: translateX(-150px);
            }

            100% {
                transform: translateX(120vw);
            }
        }

        .bird-container {
            position: absolute;
            top: 20%;
            left: -10%;
            animation: fly-across 20s linear infinite 2s;
            opacity: 0.8;
            z-index: 3;
        }

        .bird {
            width: 12px;
            height: 8px;
            fill: none;
            stroke: rgba(0, 0, 0, 0.75);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            animation: wing-flap 0.5s infinite alternate;
        }

        .b-small {
            width: 8px;
            height: 6px;
            position: absolute;
            top: 10px;
            left: -15px;
            animation-delay: 0.1s;
        }

        .b-tiny {
            width: 6px;
            height: 4px;
            position: absolute;
            top: -5px;
            left: -25px;
            animation-delay: 0.2s;
        }

        @keyframes fly-across {
            0% {
                transform: translateX(-50px) translateY(0) scale(0.8);
            }

            25% {
                transform: translateX(30vw) translateY(10px) scale(0.9);
            }

            50% {
                transform: translateX(60vw) translateY(-5px) scale(1);
            }

            100% {
                transform: translateX(120vw) translateY(15px) scale(0.8);
            }
        }

        @keyframes wing-flap {
            0% {
                d: path("M0 4 Q6 8 12 4");
                transform: translateY(0);
            }

            100% {
                d: path("M0 4 Q6 0 12 4");
                transform: translateY(2px);
            }
        }

        /* SŁOŃCE */
        .sun-orb {
            position: absolute;
            left: var(--sun-x);
            bottom: var(--sun-y);
            width: 42px;
            height: 42px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, 50%);
            box-shadow: 0 0 30px 10px rgba(255, 215, 0, 0.4);
            z-index: 5;
            transition: box-shadow 0.3s ease, background 0.3s ease;
        }

        .sun-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350%;
            height: 350%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0) 65%);
            opacity: 0.5;
            border-radius: 50%;
            pointer-events: none;
        }

        /* --- UI PANEL --- */
        .ui-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            max-height: 75dvh;
            background: var(--glass-bg);
            backdrop-filter: blur(35px) saturate(160%);
            -webkit-backdrop-filter: blur(35px) saturate(160%);
            border-radius: 36px 36px 0 0;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 -1px 20px rgba(255, 255, 255, 0.1), 0 -10px 50px rgba(0, 0, 0, 0.3);
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 20px 24px calc(20px + env(safe-area-inset-bottom)) 24px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .location-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .date-text {
            margin-top: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            text-transform: capitalize;
            letter-spacing: 0.3px;
        }

        .main-time {
            font-size: 64px;
            font-weight: 200;
            margin: 6px 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #fff 20%, rgba(255, 255, 255, 0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.1));
        }

        @media (max-height: 700px) {
            .main-time {
                font-size: 48px;
                margin: 4px 0;
            }

            .ui-panel {
                height: 65%;
            }
        }

        .content-area {
            position: relative;
            flex-grow: 1;
            overflow-y: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 5px;
            padding-bottom: 10px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.06);
            padding: 12px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .info-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 6px;
        }

        .info-value {
            font-size: 18px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: #fff;
        }

        .slider-wrapper {
            margin-top: auto;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 20;
            flex-shrink: 0;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .slider-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 700;
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            font-size: 10px;
            padding: 8px 16px;
            border-radius: 14px;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
            margin: 0;
            position: relative;
            z-index: 2;
            cursor: pointer;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 32px;
            width: 32px;
            border-radius: 50%;
            background: #ffffff;
            cursor: grab;
            margin-top: -14px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        input[type=range]:active::-webkit-slider-thumb {
            transform: scale(1.1);
            background: #f0f0f0;
        }
    </style>
</head>

<body>

    <!-- DRAFTLAB HEADER OVERLAY -->
    <div class="draftlab-header">
        <a href="../index.html" class="draftlab-logo">
            <span style="width:8px; height:8px; background:#00ff9d; border-radius:50%; display:inline-block;"></span>
            DraftLab<span style="opacity:0.5">.pl</span>
        </a>
        <a href="../changelog.html?id=suntrack" class="back-btn">
            <i data-lucide="arrow-left" width="12"></i> POWRÓT
        </a>
    </div>

    <!-- Prototype Badge -->
    <div class="prototype-badge">⚠️ Prototyp v1.0 - Archiwum</div>

    <!-- NIEBO -->
    <div class="sky-container">
        <div id="stars-wrapper" class="stars-wrapper">
            <div class="stars"></div>
        </div>

        <div class="day-layer" id="day-layer">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>

            <div class="bird-container">
                <svg class="bird" viewBox="0 0 12 8">
                    <path d="M0 4 Q6 8 12 4" fill="none" stroke="currentColor" />
                </svg>
                <svg class="bird b-small" viewBox="0 0 12 8">
                    <path d="M0 4 Q6 8 12 4" fill="none" stroke="currentColor" />
                </svg>
                <svg class="bird b-tiny" viewBox="0 0 12 8">
                    <path d="M0 4 Q6 8 12 4" fill="none" stroke="currentColor" />
                </svg>
            </div>
        </div>

        <div class="sun-orb" id="sun-orb">
            <div class="sun-glow"></div>
        </div>
    </div>

    <!-- UI -->
    <div class="ui-panel">
        <div class="header">
            <div class="location-badge" id="location-badge">
                <i data-lucide="map-pin" width="10"></i> <span id="location-name">Warszawa</span>
            </div>
            <div class="date-text" id="date-text">--</div>
            <div class="main-time" id="main-time">12:00</div>
        </div>

        <div class="content-area">
            <div id="info-grid" class="info-grid">
                <div class="info-card">
                    <span class="info-label"><i data-lucide="sunrise" width="12"></i> Wschód</span>
                    <span class="info-value" id="sunrise-val">--:--</span>
                </div>
                <div class="info-card">
                    <span class="info-label"><i data-lucide="sunset" width="12"></i> Zachód</span>
                    <span class="info-value" id="sunset-val">--:--</span>
                </div>
                <div class="info-card">
                    <span class="info-label">Golden Hour (Rano)</span>
                    <span class="info-value" id="golden-am-val">--:--</span>
                </div>
                <div class="info-card">
                    <span class="info-label">Golden Hour (Wieczór)</span>
                    <span class="info-value" id="golden-pm-val">--:--</span>
                </div>

                <div class="info-card">
                    <span class="info-label">Faza</span>
                    <span class="info-value" id="phase-val">--</span>
                </div>
                <div class="info-card">
                    <span class="info-label">Wysokość</span>
                    <span class="info-value" id="elevation-val">0°</span>
                </div>
            </div>
        </div>

        <div class="slider-wrapper">
            <div class="slider-header">
                <span class="slider-label">Podróż w czasie</span>
                <button class="reset-btn" onclick="resetToNow()">TERAZ</button>
            </div>
            <input type="range" id="time-slider" min="0" max="1439" value="720">
        </div>
    </div>

    <script>
        lucide.createIcons();

        let LAT = 52.2297;
        let LNG = 21.0122;
        const now = new Date();

        const sunOrb = document.getElementById('sun-orb');
        const starsWrapper = document.getElementById('stars-wrapper');
        const dayLayer = document.getElementById('day-layer');
        const root = document.documentElement;

        const locationNameEl = document.getElementById('location-name');

        const dateOptions = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById('date-text').innerText = now.toLocaleDateString('pl-PL', dateOptions);

        const COLOR_KEYS = [
            { alt: -90, stops: ['#040d12', '#182848', '#2b5876'] },
            { alt: -18, stops: ['#0f2027', '#203a43', '#2c5364'] },
            { alt: -6, stops: ['#16222A', '#3A6073', '#3A6073'] },
            { alt: -2, stops: ['#3e1c33', '#801818', '#c02425'] },
            { alt: 2, stops: ['#b20a2c', '#ea5753', '#ffbe76'] },
            { alt: 10, stops: ['#2980B9', '#6DD5FA', '#FFFFFF'] }
        ];

        function lerpColor(c1, c2, f) {
            const hex2rgb = (hex) => {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return [r, g, b];
            }
            const rgb1 = hex2rgb(c1);
            const rgb2 = hex2rgb(c2);
            const r = Math.round(rgb1[0] + (rgb2[0] - rgb1[0]) * f);
            const g = Math.round(rgb1[1] + (rgb2[1] - rgb1[1]) * f);
            const b = Math.round(rgb1[2] + (rgb2[2] - rgb1[2]) * f);
            return `rgb(${r},${g},${b})`;
        }

        function getGradient(alt) {
            let start = COLOR_KEYS[0], end = COLOR_KEYS[COLOR_KEYS.length - 1];
            for (let i = 0; i < COLOR_KEYS.length - 1; i++) {
                if (alt >= COLOR_KEYS[i].alt && alt <= COLOR_KEYS[i + 1].alt) {
                    start = COLOR_KEYS[i]; end = COLOR_KEYS[i + 1]; break;
                }
            }
            const factor = Math.min(1, Math.max(0, (alt - start.alt) / (end.alt - start.alt)));
            return {
                top: lerpColor(start.stops[0], end.stops[0], factor),
                mid: lerpColor(start.stops[1], end.stops[1], factor),
                bottom: lerpColor(start.stops[2], end.stops[2], factor)
            };
        }

        function update(mins) {
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            const currentTimeStr = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
            document.getElementById('main-time').innerText = currentTimeStr;

            const d = new Date(now);
            d.setHours(h, m, 0);

            const times = SunCalc.getTimes(d, LAT, LNG);
            const pos = SunCalc.getPosition(d, LAT, LNG);

            const fmt = date => date ? date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0') : '--:--';
            document.getElementById('sunrise-val').innerText = fmt(times.sunrise);
            document.getElementById('sunset-val').innerText = fmt(times.sunset);

            document.getElementById('golden-am-val').innerText = fmt(times.goldenHourEnd);
            document.getElementById('golden-pm-val').innerText = fmt(times.goldenHour);

            const altDeg = pos.altitude * (180 / Math.PI);
            document.getElementById('elevation-val').innerText = Math.round(altDeg) + '°';

            let phase = "Noc";
            if (altDeg > 6) phase = "Dzień";
            else if (altDeg > -4) phase = "Złota Godzina";
            else if (altDeg > -12) phase = "Blue Hour";
            document.getElementById('phase-val').innerText = phase;

            const grad = getGradient(altDeg);
            root.style.setProperty('--bg-top', grad.top);
            root.style.setProperty('--bg-mid', grad.mid);
            root.style.setProperty('--bg-bottom', grad.bottom);

            let starsOp = 0; let dayOp = 0;
            if (altDeg < -12) { starsOp = 1; dayOp = 0; }
            else if (altDeg < -6) { starsOp = ((-6 - altDeg) / 6); dayOp = 0; }
            else if (altDeg < 0) { starsOp = 0; dayOp = (altDeg - (-6)) / 6; }
            else { starsOp = 0; dayOp = 1; }

            starsWrapper.style.opacity = starsOp;
            dayLayer.style.opacity = dayOp;

            const xPercent = (mins / 1440) * 100;
            const horizonY = 60; const skyRange = 40;
            let yPercent = horizonY + (altDeg / 90) * skyRange;

            root.style.setProperty('--sun-x', xPercent + '%');
            root.style.setProperty('--sun-y', yPercent + '%');

            if (altDeg < 4 && altDeg > -4) {
                sunOrb.style.background = '#ff7e5f';
                sunOrb.style.boxShadow = '0 0 50px 15px rgba(255, 100, 50, 0.9)';
            } else if (altDeg >= 4) {
                sunOrb.style.background = '#fff';
                sunOrb.style.boxShadow = '0 0 40px 10px rgba(255, 255, 200, 0.6)';
            } else {
                sunOrb.style.background = 'transparent'; sunOrb.style.boxShadow = 'none';
            }
        }

        function initLocation() {
            if ("geolocation" in navigator) {
                locationNameEl.innerText = "Lokalizowanie...";

                const options = {
                    enableHighAccuracy: true,
                    timeout: 5000,
                    maximumAge: 0
                };

                navigator.geolocation.getCurrentPosition(async (position) => {
                    LAT = position.coords.latitude;
                    LNG = position.coords.longitude;

                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${LAT}&lon=${LNG}`);
                        if (!response.ok) throw new Error("Błąd sieci");
                        const data = await response.json();
                        const address = data.address;
                        const city = address.city ||
                            address.town ||
                            address.village ||
                            address.suburb ||
                            address.municipality ||
                            address.county ||
                            "Twoja Lokalizacja";
                        locationNameEl.innerText = city;
                    } catch (e) {
                        console.warn("Nie udało się pobrać nazwy miasta:", e);
                        locationNameEl.innerText = `${LAT.toFixed(2)}, ${LNG.toFixed(2)}`;
                    }

                    resetToNow();

                }, (error) => {
                    console.warn(`Geolokalizacja niedostępna: ${error.message}`);
                    locationNameEl.innerText = "Warszawa";
                    resetToNow();
                }, options);
            } else {
                locationNameEl.innerText = "Warszawa";
                resetToNow();
            }
        }

        function resetToNow() {
            const d = new Date();
            const mins = d.getHours() * 60 + d.getMinutes();
            document.getElementById('time-slider').value = mins;
            update(mins);
        }

        document.getElementById('time-slider').addEventListener('input', (e) => update(e.target.value));

        initLocation();

    </script>
</body>

</html>
